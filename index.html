<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Termômetro de Segurança T1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho com termômetro e controles de mês e modo; abas Ranking, Resumo, Bases do mês e Regras; tabelas largas rolam no próprio contêiner. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15202b; --muted:#5a6775; --line:#d9e0e7;
  --accent:#1d5bbf; --accent-soft:#e3ecfa; --accent-ink:#ffffff;
  --good:#17845a; --good-bg:#e1f3ea; --mid:#9a6c00; --mid-bg:#fbf0d2; --low:#c25418; --low-bg:#fbe5d8; --bad:#bf3434; --bad-bg:#f9e0e0; --na:#7c8894; --na-bg:#eceff2;
  --mercury:#d23b2f;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b2530; --ink:#e4eaf0; --muted:#94a2b0; --line:#28343f;
  --accent:#78a4f2; --accent-soft:#1d2c44; --accent-ink:#0e141a;
  --good:#46c08a; --good-bg:#15302a; --mid:#e0b543; --mid-bg:#33290f; --low:#ef9255; --low-bg:#3a2416; --bad:#ef6f6f; --bad-bg:#3b1c1f; --na:#8592a0; --na-bg:#222c36;
  --mercury:#ef5a4c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b2530; --ink:#e4eaf0; --muted:#94a2b0; --line:#28343f;
  --accent:#78a4f2; --accent-soft:#1d2c44; --accent-ink:#0e141a;
  --good:#46c08a; --good-bg:#15302a; --mid:#e0b543; --mid-bg:#33290f; --low:#ef9255; --low-bg:#3a2416; --bad:#ef6f6f; --bad-bg:#3b1c1f; --na:#8592a0; --na-bg:#222c36;
  --mercury:#ef5a4c; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.6rem;font-weight:750}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.eyebrow{font-family:var(--f-display);font-stretch:90%;font-size:.72rem;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* topo */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.therm{width:22px;height:64px;position:relative;flex:none}
.therm .tube{position:absolute;left:7px;top:0;width:8px;height:50px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.therm .hg{position:absolute;left:0;right:0;bottom:0;background:var(--mercury);transition:height .6s ease}
.therm .bulb{position:absolute;left:1px;bottom:0;width:20px;height:20px;border-radius:50%;background:var(--mercury)}
.brand .sub{color:var(--muted);font-size:.85rem}
.br-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.br-score{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.br-score .big{font-family:var(--f-display);font-stretch:80%;font-size:2rem;font-weight:800;line-height:1}
.br-score .big small{font-size:.9rem;color:var(--muted);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=month],input[type=search],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-stretch:88%;font-weight:650;font-size:.98rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mercury)}
.panel{display:flex;flex-direction:column;gap:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.notice.warn{border-color:var(--mid);background:var(--mid-bg)}
.notice.err{border-color:var(--bad);background:var(--bad-bg)}

/* tabelas de ranking */
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--surface-2);font-family:var(--f-display);font-stretch:88%;font-weight:650;font-size:.78rem;color:var(--muted);vertical-align:bottom}
thead th .dir{display:block;font-family:var(--f-body);font-weight:400;font-size:.7rem;letter-spacing:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.brasil td{font-weight:600;background:var(--surface-2)}
td.rk{font-family:var(--f-display);font-stretch:80%;font-weight:750;font-size:1.05rem;width:44px}
td.rk.ano{color:var(--muted);font-weight:600;font-size:.95rem}
td.name{min-width:180px;white-space:normal}
td.name .n{font-weight:600}
td.name .s{color:var(--muted);font-size:.78rem}
.delta{font-family:var(--f-mono);font-size:.75rem}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.kc{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.kc .v{font-family:var(--f-mono);font-size:.8rem}
.pt{display:inline-block;min-width:34px;text-align:center;font-family:var(--f-mono);font-size:.74rem;font-weight:500;border-radius:4px;padding:1px 4px}
.p11{background:var(--good-bg);color:var(--good)} .p55{background:var(--mid-bg);color:var(--mid)} .p275{background:var(--low-bg);color:var(--low)} .p0{background:var(--bad-bg);color:var(--bad)} .pna{background:var(--na-bg);color:var(--na)}
.total{display:flex;align-items:center;gap:8px;min-width:150px}
.total .val{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:1.15rem;min-width:44px;text-align:right}
.bar{position:relative;height:8px;flex:1;min-width:80px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--mercury);border-radius:4px}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:var(--surface)}
.heat{font-family:var(--f-mono);font-size:.8rem;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);align-items:center}

/* resumo */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-stretch:82%;font-size:1.6rem;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.tile b small{font-size:.85rem;color:var(--muted);font-weight:600}
.rzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
svg.chart .lbl{fill:var(--ink);font-size:12px;font-family:var(--f-mono);font-weight:500}
svg.chart .lbl2{fill:var(--ink);font-size:12px;font-family:var(--f-body)}
svg.chart .real{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
svg.chart .proj{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
svg.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.chart .dot.last{fill:var(--mercury)}
svg.chart .pdot{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
svg.chart rect.bar.p11{fill:var(--good)} svg.chart rect.bar.p55{fill:var(--mid)} svg.chart rect.bar.p275{fill:var(--low)} svg.chart rect.bar.p0{fill:var(--bad)}
svg.chart g:hover rect.bar{opacity:.8}
.key{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-left:6px}
.key.proj{border-top:2px dashed var(--muted)}
.multiples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
svg.chart.small{max-height:90px}
.mult{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mult .mh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.85rem}
.mult .mf{font-size:.72rem}
.rztable td,.rztable th{text-align:left}
.rztable .curm{background:var(--accent-soft)}
/* bases */
.status-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.grid-kpi{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:12px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.slot{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:start;padding-block:6px;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--line);border:1px solid var(--muted)}
.dot.ok{background:var(--good);border-color:var(--good)}
.slot .lbl{font-weight:500;min-width:0}
.slot .meta{color:var(--muted);font-size:.78rem}
.slot .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);background:var(--surface-2)}
.man{font-family:var(--f-body);font-size:.66rem;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 3px;margin-left:2px}
.qin{display:flex;gap:4px;align-items:center;white-space:nowrap}
.qin input{width:70px;min-height:28px;padding:3px 6px}
.qin input.pts{width:52px}
.qv{font-family:var(--f-mono);font-size:.82rem}
table.quartis td{white-space:nowrap}
.manin{display:flex;gap:4px;align-items:center}
.manin input{width:84px;min-height:28px;padding:3px 6px}
details.warns{font-size:.82rem}
details.warns summary{cursor:pointer;color:var(--mid)}
details.warns ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}

/* regras */
.rules td{white-space:normal;vertical-align:top}
.band{display:flex;flex-wrap:wrap;gap:4px}
.qlist{display:flex;flex-direction:column;gap:8px;margin:0;padding-left:20px}
.qlist li{max-width:80ch}

/* modal */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,15,20,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.dlg>header{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg>.body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px;font-family:var(--f-mono);font-size:.8rem}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:6px;padding:6px 8px;font-size:.82rem;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:.7rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.trend{display:flex;gap:4px;align-items:flex-end;height:90px;padding-top:6px}
.trend .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.trend .c i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:3px 3px 0 0}
.trend .c i.cur{background:var(--mercury)}
.trend .c span{font-size:.65rem;color:var(--muted);font-family:var(--f-mono)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:calc(100vw - 32px)}
@media (max-width:760px){
  .top{grid-template-columns:1fr auto}
  .controls{grid-column:1/-1;justify-content:flex-start}
  h1{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.seg.mode button{padding:6px 12px;font-size:.88rem}
.controls label.nm{display:flex;gap:6px;align-items:center}
.controls input[type=month]{min-width:0}

</style>
<div class="wrap">
  <header class="top">
    <div class="brand">

</div>

<script>
/* Armazenamento do Termômetro: dois modos com a mesma interface.
   - claude: banco compartilhado do artifact no claude.ai (window.claude.use('db')).
   - github: arquivos JSON numa pasta do repositório (GitHub Pages para leitura; API do GitHub com token para gravar,
     cada gravação = 1 commit com todos os arquivos). O token fica só no navegador de quem edita (localStorage). */
(function (root) {
  const CHUNK_BYTES = 180000;
  const toArr = (fields, rows) => rows.map(o => fields.map(f => o[f] === undefined ? null : o[f]));
  const toObj = (fields, arr) => arr.map(r => { const o = {}; fields.forEach((f, j) => o[f] = r[j]); return o; });
  async function retry(fn) { try { return await fn(); } catch (e) { if (e && (e.code === 'unavailable' || e.retry)) { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); return fn(); } throw e; } }

  /* ---------------- claude.ai ---------------- */
  function claudeStore(db, user) {
    const q = async (col, field, val) => (await db.collection(col).where(field, '==', val).get()).docs.map(d => Object.assign({ _id: d.id }, d.data()));
    const S = {
      kind: 'claude', label: 'claude.ai', canWrite: null, canEdit: null,
      async init() {
        if (user && user.can) { try { S.canWrite = await user.can('data.write'); } catch (e) { } }
        if (user && user.canEdit) { try { S.canEdit = await user.canEdit(); } catch (e) { } }
      },
      async me() { try { const m = user && await user.me(); return m && m.id || null; } catch (e) { return null; } },
      async names(ids) { const out = {}; if (!user || !user.profiles || !ids.length) return out; try { const ps = await user.profiles(ids); ids.forEach(id => out[id] = (ps[id] && ps[id].name) || ''); } catch (e) { } return out; },
      async listResults() { const out = {}; (await db.collection('results').get()).docs.forEach(d => { const x = d.data(); if (x && x.month) out[x.month] = x; }); return out; },
      async listOverrides() { const out = {}; (await db.collection('overrides').get()).docs.forEach(d => { const x = d.data(); if (x && x.month) out[x.month] = x.items || {}; }); return out; },
      async getScoring() { const d = await db.doc('config/scoring').get(); return d.exists ? d.data() : null; },
      async inputsMeta(m) { const out = {}; (await q('inputs', 'month', m)).forEach(r => out[r.slot] = r); return out; },
      async loadInputs(m, metas) {
        const by = {}; (await q('chunks', 'month', m)).forEach(d => (by[d.slot] = by[d.slot] || []).push(d));
        const inputs = {};
        for (const [slot, list] of Object.entries(by)) {
          const n = metas[slot] ? metas[slot].chunks : list.length; list.sort((a, b) => a.i - b.i);
          inputs[slot] = []; list.filter(c => c.i < n).forEach(c => inputs[slot].push(...toObj(c.fields, c.rows)));
        }
        return inputs;
      },
      // ops: [{type:'input', m, slot, fields, rows, meta, oldChunks}, {type:'result', m, doc}, {type:'overrides', m, items}, {type:'scoring', doc}]
      async saveBatch(ops, onProg) {
        let done = 0; const total = ops.length;
        for (const op of ops) {
          if (op.type === 'input') {
            const arr = toArr(op.fields, op.rows); const chunks = []; let cur = [], size = 0;
            for (const r of arr) { const s = JSON.stringify(r).length + 1; if (size + s > CHUNK_BYTES && cur.length) { chunks.push(cur); cur = []; size = 0; } cur.push(r); size += s; }
            if (cur.length || !chunks.length) chunks.push(cur);
            for (let i = 0; i < chunks.length; i++) await retry(() => db.doc(`chunks/${op.m}__${op.slot}__${i}`).set({ month: op.m, slot: op.slot, i, fields: op.fields, rows: chunks[i] }));
            for (let i = chunks.length; i < (op.oldChunks || 0); i++) await retry(() => db.doc(`chunks/${op.m}__${op.slot}__${i}`).delete());
            op.meta.chunks = chunks.length;
            await retry(() => db.doc(`inputs/${op.m}__${op.slot}`).set(op.meta));
          } else if (op.type === 'result') await retry(() => db.doc('results/' + op.m).set(op.doc));
          else if (op.type === 'overrides') await retry(() => db.doc('overrides/' + op.m).set({ month: op.m, items: op.items }));
          else if (op.type === 'scoring') await retry(() => db.doc('config/scoring').set(op.doc));
          onProg && onProg(++done / total);
        }
      },
    };
    return S;
  }

  /* ---------------- GitHub ---------------- */
  // Layout no repositório (pasta dataPath, padrão "data"):
  //   index.json                      { results:[meses], overrides:[meses], inputs:[meses], updatedAt, updatedBy }
  //   results/AAAA-MM.json            resultado do mês
  //   overrides/AAAA-MM.json          valores manuais do mês
  //   config/scoring.json             quartis vigentes
  //   inputs/AAAA-MM/_meta.json       { base: meta }
  //   inputs/AAAA-MM/<base>.json      { fields, rows }
  function githubStore(cfg) {
    const base = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}`;
    const dp = (cfg.dataPath || 'data').replace(/\/+$/, '');
    const hdr = (extra) => Object.assign({ 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, cfg.token ? { 'Authorization': 'Bearer ' + cfg.token } : {}, extra || {});
    async function api(path, opts) {
      const r = await fetch(path.startsWith('http') ? path : base + path, Object.assign({}, opts, { headers: hdr(opts && opts.headers) }));
      if (!r.ok) { const e = new Error(`GitHub ${r.status}: ${(await r.text()).slice(0, 200)}`); e.status = r.status; if (r.status === 409 || r.status === 422 || r.status >= 500) e.retry = true; throw e; }
      return r.status === 204 ? null : r.json();
    }
    async function readJSON(rel) {
      let r;
      if (cfg.token) r = await fetch(`${base}/contents/${dp}/${rel}?ref=${encodeURIComponent(cfg.branch || 'main')}&t=${Date.now()}`, { headers: hdr({ 'Accept': 'application/vnd.github.raw+json' }), cache: 'no-store' });
      else if (/\.github\.io$/i.test(location.hostname) || cfg.relative) r = await fetch(`${dp}/${rel}?t=${Date.now()}`, { cache: 'no-store' });
      else r = await fetch(`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch || 'main'}/${dp}/${rel}?t=${Date.now()}`, { cache: 'no-store' });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`Não consegui ler ${rel} (${r.status}).`);
      return r.json();
    }
    // um commit com vários arquivos: files = { caminhoRelativo: objeto | null (apaga) }
    async function commit(files, message) {
      const branch = cfg.branch || 'main';
      const attempt = async () => {
        const ref = await api(`/git/ref/heads/${encodeURIComponent(branch)}`);
        const head = await api(`/git/commits/${ref.object.sha}`);
        const tree = [];
        for (const [rel, obj] of Object.entries(files)) {
          const path = `${dp}/${rel}`;
          if (obj === null) { tree.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
          const content = JSON.stringify(obj);
          if (content.length < 60000) tree.push({ path, mode: '100644', type: 'blob', content });
          else { const b = await api('/git/blobs', { method: 'POST', body: JSON.stringify({ content, encoding: 'utf-8' }) }); tree.push({ path, mode: '100644', type: 'blob', sha: b.sha }); }
        }
        const t = await api('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
        const c = await api('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: t.sha, parents: [ref.object.sha] }) });
        await api(`/git/refs/heads/${encodeURIComponent(branch)}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
      };
      try { await attempt(); } catch (e) { if (e.retry) { await new Promise(r => setTimeout(r, 1200)); await attempt(); } else throw e; }
    }
    let meCache;
    const S = {
      kind: 'github', label: `GitHub ${cfg.owner}/${cfg.repo}`, canWrite: false, canEdit: false, user: null,
      async init() {
        if (!cfg.token) return;
        const u = await api('https://api.github.com/user'); meCache = u.login; S.user = u;
        const repo = await api('');
        S.canWrite = !!(repo.permissions && (repo.permissions.push || repo.permissions.admin || repo.permissions.maintain));
        S.canEdit = S.canWrite;
      },
      async me() { return meCache || null; },
      async names(ids) { const out = {}; ids.forEach(id => out[id] = id); return out; },
      async index() { return (await readJSON('index.json')) || { results: [], overrides: [], inputs: [] }; },
      async listResults() { const idx = await S.index(); const out = {}; await Promise.all((idx.results || []).map(async m => { const d = await readJSON(`results/${m}.json`); if (d) out[m] = d; })); return out; },
      async listOverrides() { const idx = await S.index(); const out = {}; await Promise.all((idx.overrides || []).map(async m => { const d = await readJSON(`overrides/${m}.json`); if (d) out[m] = d.items || {}; })); return out; },
      async getScoring() { return readJSON('config/scoring.json'); },
      async inputsMeta(m) { return (await readJSON(`inputs/${m}/_meta.json`)) || {}; },
      async loadInputs(m, metas) {
        const out = {};
        await Promise.all(Object.keys(metas).map(async slot => { const d = await readJSON(`inputs/${m}/${slot}.json`); if (d) out[slot] = toObj(d.fields, d.rows); }));
        return out;
      },
      async saveBatch(ops, onProg) {
        if (!cfg.token) { const e = new Error('Conecte o GitHub com um token para salvar.'); e.code = 'invalid_argument'; throw e; }
        const files = {}; const idx = await S.index();
        const add = (k, m) => { idx[k] = Array.from(new Set([...(idx[k] || []), m])).sort(); };
        const metas = {};
        for (const op of ops) {
          if (op.type === 'input') {
            files[`inputs/${op.m}/${op.slot}.json`] = { fields: op.fields, rows: toArr(op.fields, op.rows) };
            if (!metas[op.m]) metas[op.m] = await S.inputsMeta(op.m);
            op.meta.chunks = 1; metas[op.m][op.slot] = op.meta; add('inputs', op.m);
          } else if (op.type === 'result') { files[`results/${op.m}.json`] = op.doc; add('results', op.m); }
          else if (op.type === 'overrides') { files[`overrides/${op.m}.json`] = { month: op.m, items: op.items }; add('overrides', op.m); }
          else if (op.type === 'scoring') files['config/scoring.json'] = op.doc;
        }
        for (const [m, meta] of Object.entries(metas)) files[`inputs/${m}/_meta.json`] = meta;
        idx.updatedAt = new Date().toISOString(); idx.updatedBy = meCache || null;
        files['index.json'] = idx;
        onProg && onProg(0.3);
        const kinds = Array.from(new Set(ops.map(o => o.type)));
        const months = Array.from(new Set(ops.map(o => o.m).filter(Boolean)));
        await commit(files, `Termômetro T1: ${kinds.join(', ')}${months.length ? ' ' + months.join(', ') : ''}${meCache ? ' (' + meCache + ')' : ''}`);
        onProg && onProg(1);
      },
    };
    return S;
  }

  // configuração do GitHub: localStorage > window.TERMO_GITHUB > endereço do GitHub Pages (dono.github.io/repositorio)
  function githubConfig() {
    let saved = {}; try { saved = JSON.parse(localStorage.getItem('termo.github') || '{}'); } catch (e) { }
    const preset = root.TERMO_GITHUB || {};
    const fromUrl = {};
    const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
    if (m) { fromUrl.owner = m[1]; const seg = location.pathname.split('/').filter(Boolean)[0]; if (seg && !/\./.test(seg)) fromUrl.repo = seg; }
    const cfg = Object.assign({ branch: 'main', dataPath: 'data' }, fromUrl, preset, saved);
    return cfg.owner && cfg.repo ? cfg : null;
  }
  function saveGithubConfig(cfg) { try { localStorage.setItem('termo.github', JSON.stringify(cfg)); } catch (e) { } }

  root.TermoStores = { claudeStore, githubStore, githubConfig, saveGithubConfig, retry };
})(typeof window !== 'undefined' ? window : globalThis);

  const norm = s => s == null ? '' : String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
  function colIdx(L) { let n = 0; for (const ch of L) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
  const cell = (aoa, r, L) => { const row = aoa[r]; return row ? row[colIdx(L)] : undefined; };
  const rows = aoa => aoa ? aoa.map((_, i) => i) : [];
  const sum = a => a.reduce((s, x) => s + (isN(x) ? x : 0), 0);
  const num = v => isN(v) ? v : 0;

  /* ---------------- bases (slots) ---------------- */
  // Cada slot vem de uma aba da planilha mensal. A extração guarda só as colunas usadas, em linhas compactas
  // [tag, ...campos], para caber no armazenamento e permitir recalcular sem a planilha original.
  const SLOTS = [
    { id: 'qlp',   nome: 'QLP (DM People)',              sheets: ['QLP'], kpis: ['faixa', 'est'], hdr: [['A', 'MOT']], dyn: 'qlp' },
    { id: 'tel',   nome: 'Telemetria empilhadeira',      sheets: ['TELEMETRIA'], kpis: ['tel'], hdr: [['C', 'REGIAO'], ['D', 'UNIDADE'], ['E', 'QTD EMP'], ['F', 'INDICE']] },
    { id: 'faixa', nome: 'Condutores por faixa',         sheets: ['FAIXAS'], kpis: ['faixa'], hdr: [['U', 'GEO'], ['V', 'OPERACAO'], ['W', 'FAIXA'], ['X', 'QUANTIDADE']] },
    { id: 'est',   nome: 'Estouro de 12h',               sheets: ['ESTOURO 12'], kpis: ['est'], hdr: [['V', 'OPERACAO'], ['W', 'EMPRESA'], ['X', 'JORNADA'], ['Y', 'QLP']] },
    { id: 'lid',   nome: 'Monitoramento de liderança',   sheets: ['MONITORAMENTO_LIDERANCA', 'DTO_LIDERANCA'], kpis: ['lid'], hdr: [['Y', 'EMPRESA'], ['Z', 'OPERACAO'], ['AK', 'MONITORAMENTO'], ['AL', 'META']] },
    { id: 'dto',   nome: 'DTO com desvios',              sheets: ['DTO_ DESVIOS', 'DTO_DESVIOS'], kpis: ['dto'], hdr: [['Z', 'EMPRESA'], ['AA', 'OPERACAO'], ['AB', 'REALIZADOS'], ['AC', 'COM DESVIOS']] },
    { id: 'logon', nome: 'LogOn Segurança',              sheets: ['LOG ON SEG'], kpis: ['logon'], hdr: [['A', 'CANAL'], ['B', 'REGIONAL'], ['F', 'NUMERADOR'], ['G', 'DENOMINADOR']] },
    { id: 'guard', nome: 'Relatos Guardian',             sheets: ['BASE GUARDIAN'], kpis: ['guard'], hdr: [['C', 'NOME'], ['H', 'SOMA'], ['I', 'QLP'], ['J', 'RELATO']] },
    { id: 'okr',   nome: 'OKR Rollover',                 sheets: ['OKR ROLLOVER'], kpis: ['okr'], hdr: [['B', 'UNIDADE'], ['Y', 'INDICE']] },
    { id: 'nov',   nome: 'DTO de novatos',               sheets: ['DTO_NOVOS'], kpis: ['nov'], hdr: [['Y', 'EMPRESA'], ['Z', 'OPERACAO'], ['AA', 'ELEGIVEL'], ['AB', 'NAO REALIZADO']] }
  ];
  const slotBySheet = name => { const n = norm(name); return SLOTS.find(sl => sl.sheets.some(x => norm(x) === n)); };
  function checkLayout(slot, aoa) {
    const miss = [];
    slot.hdr.forEach(([L, tok]) => {
      let ok = false;
      for (let r = 0; r < Math.min(4, aoa.length) && !ok; r++) { const v = norm(cell(aoa, r, L)); if (v.includes(tok)) ok = true; }
      if (!ok) miss.push(L + ' (' + tok.toLowerCase() + ')');
    });
    return miss;
  }
  const LOGI = 'OPERACIONAL LOGISTICO';
  const EXTRACT = {
    qlp(A) {
      // colunas localizadas pelo cabeçalho (o layout do export mudou em set/2026: TOTAL, ATIVO, AUSENTE...)
      const hdr = {}; for (let r = 0; r < Math.min(4, A.length); r++) (A[r] || []).forEach((v, i) => { const t = norm(v); if (t && hdr[t] == null) hdr[t] = i; });
      const find = (...toks) => { for (const k of Object.keys(hdr)) if (toks.every(t => k.includes(t))) return hdr[k]; return -1; };
      const cF = find('MOT'), cE = find('EMPRESA'), cR = find('REGIONAL'), cO = find('OPERACAO'), cC = find('TIPO CARGO');
      let cQ = find('QLP EFETIVO'); if (cQ < 0) cQ = hdr['QLP ATIVO'] != null ? hdr['QLP ATIVO'] : find('QLP', 'ATIVO');
      if (cQ < 0) cQ = colIdx('N');
      const m = new Map();
      rows(A).forEach(r => {
        const row = A[r] || []; const q = row[cQ]; if (!isN(q)) return;
        const flag = row[cF >= 0 ? cF : 0]; if (flag == null || flag === '') return;
        const k = [flag, row[cE >= 0 ? cE : 3], row[cR >= 0 ? cR : 5], row[cO >= 0 ? cO : 6], row[cC >= 0 ? cC : 9]];
        const key = JSON.stringify(k); const e = m.get(key);
        if (e) e[6] += q; else m.set(key, ['q', ...k, q]);
      });
      return [...m.values()];
    },
    tel(A) {
      const out = [];
      rows(A).forEach(r => {
        const a = cell(A, r, 'A'), c = cell(A, r, 'C'), d = cell(A, r, 'D'), e = cell(A, r, 'E'), f = cell(A, r, 'F');
        if (!isN(f)) return;
        if (d === 'Total') out.push(['tr', c, f]);
        else if (c === 'Total' && d == null) out.push(['tb', f]);
        else if (isN(e) && d) out.push(['u', c, d, e, f, a == null ? null : a]);
      });
      return out;
    },
    faixa(A) {
      const out = [];
      rows(A).forEach(r => {
        const g = cell(A, r, 'U'), op = cell(A, r, 'V'), fx = cell(A, r, 'W'), q = cell(A, r, 'X');
        if (g != null && op != null && typeof fx === 'string') out.push(['r', g, op, fx, num(q)]);
        const cod = cell(A, r, 'AK'), emp = cell(A, r, 'AL');
        if (isN(cod) && emp) out.push(['o', cod, emp, num(cell(A, r, 'AR')) + num(cell(A, r, 'AS')) + num(cell(A, r, 'AT'))]);
      });
      return out;
    },
    est(A) {
      const out = [];
      rows(A).forEach(r => { const u = cell(A, r, 'U'), op = cell(A, r, 'V'), emp = cell(A, r, 'W'), j = cell(A, r, 'X'), q = cell(A, r, 'Y'); if (op != null && isN(j)) out.push(['r', u, op, emp, j, num(q)]); });
      return out;
    },
    lid(A) {
      const out = [];
      rows(A).forEach(r => {
        const op = cell(A, r, 'Z'), mt = cell(A, r, 'AB');
        if (op != null && isN(mt)) out.push(['r', cell(A, r, 'X'), cell(A, r, 'Y'), op, num(cell(A, r, 'AK')), num(cell(A, r, 'AL'))]);
        // pivô de operações (AP = GEO, AQ = operação) e de-para de nomes (AV -> AW)
        const geo = cell(A, r, 'AP'), pop = cell(A, r, 'AQ');
        if (typeof geo === 'string' && /FAB/i.test(geo) && typeof pop === 'string') out.push(['g', geo, pop]);
        const dv = cell(A, r, 'AV'), dw = cell(A, r, 'AW');
        if (typeof dv === 'string' && typeof dw === 'string' && !/FAB|BRASIL|DE-PARA|REGIONAL/i.test(dv)) out.push(['d', dv, dw]);
      });
      return out;
    },
    dto(A) {
      const out = [];
      rows(A).forEach(r => { const op = cell(A, r, 'AA'), re = cell(A, r, 'AB'); if (op == null || !isN(re)) return; const p = cell(A, r, 'AE'); out.push(['r', cell(A, r, 'Y'), cell(A, r, 'Z'), op, re, num(cell(A, r, 'AC')), isN(p) ? p : null]); });
      return out;
    },
    logon(A) {
      const out = [];
      rows(A).forEach(r => {
        const canal = cell(A, r, 'A'), f = cell(A, r, 'F');
        if (canal != null && isN(f)) { const p = cell(A, r, 'H'); out.push(['r', String(canal), cell(A, r, 'B'), cell(A, r, 'C'), cell(A, r, 'D'), f, num(cell(A, r, 'G')), isN(p) ? p : null]); }
        const cod = cell(A, r, 'L'), nm = cell(A, r, 'M'); if (isN(cod) && typeof nm === 'string') out.push(['m', cod, nm]);
      });
      return out;
    },
    guard(A) {
      const out = [];
      rows(A).forEach(r => {
        const key = cell(A, r, 'C'), cod = cell(A, r, 'B'), j = cell(A, r, 'J');
        if (typeof key === 'string' && typeof cod === 'string' && isN(j) && isN(cell(A, r, 'I'))) out.push(['p', key, j, cod, num(cell(A, r, 'H')), num(cell(A, r, 'I'))]);
        if (isN(cod) && isN(j)) out.push(['o', cod, j]);
      });
      return out;
    },
    okr(A) {
      const out = [];
      rows(A).forEach(r => { const b = cell(A, r, 'B'), y = cell(A, r, 'Y'); if (b != null && isN(y)) out.push(['r', b, y]); });
      return out;
    },
    nov(A) {
      const out = [];
      rows(A).forEach(r => { const op = cell(A, r, 'Z'), e = cell(A, r, 'AA'); if (op == null || !isN(e)) return; out.push(['r', cell(A, r, 'X'), cell(A, r, 'Y'), op, e, num(cell(A, r, 'AB'))]); });
      return out;
    }
  };
  // sheets: { nomeDaAba: aoa } -> { slotId: { rows, avisos } }
  function extractAll(sheets) {
    const out = {};
    Object.keys(sheets).forEach(name => {
      const sl = slotBySheet(name); if (!sl) return;
      const miss = checkLayout(sl, sheets[name]);
      if (sl.dyn === 'qlp') { const H = (sheets[name].slice(0, 4).flat().map(norm)).join('|'); ['EMPRESA', 'REGIONAL', 'OPERACAO', 'TIPO CARGO'].forEach(t => { if (!H.includes(t)) miss.push(t.toLowerCase()); }); if (!H.includes('QLP EFETIVO')) miss.push('QLP EFETIVO ausente: usado QLP ATIVO'); }
      const rowsX = EXTRACT[sl.id](sheets[name]);
      out[sl.id] = { rows: rowsX, sheet: name, layout: miss };
    });
    return out;
  }

  /* ---------------- cálculo dos KPIs ---------------- */
  const REGS = { 'Regional NE': ['NE - FAB', 'NORDESTE - FABRICA'], 'Regional CO': ['CO - FAB', 'CENTRO OESTE - FABRICA'], 'Regional SE': ['SE - FAB', 'SUDESTE FABRICA'], 'Regional Sul': ['SUL - FAB', 'SUL - FABRICA'] };
  // rows de um slot por tag
  const T = (slots, id, tag) => ((slots[id] && slots[id].rows) || (Array.isArray(slots[id]) ? slots[id] : [])).filter(r => r[0] === tag);

  function computeValues(slots, master, ovp) {
    const pv = (k, p) => { const o = ovp && ovp(k, p); return o !== undefined ? o : out[k].plant[p.name]; };
    const out = {}; KPIS.forEach(k => out[k.id] = { plant: {}, reg: {}, op: {} });
    const plants = master.plants, regs = master.regs.filter(r => r.code), ops = master.ops;
    const qlp = T(slots, 'qlp', 'q').map(r => ({ flag: r[1], emp: norm(r[2]), reg: norm(r[3]), op: norm(r[4]), cargo: norm(r[5]), q: r[6] }));
    const qsum = f => sum(qlp.filter(f).map(x => x.q));

    /* Telemetria */
    {
      const u = T(slots, 'tel', 'u'); const unit = {};
      u.forEach(r => { if (r[5] != null) unit[norm(r[5])] = r[4]; });
      const byReg = {}; u.forEach(r => { const g = byReg[norm(r[1])] = byReg[norm(r[1])] || [0, 0]; g[0] += r[4] * r[3]; g[1] += r[3]; });
      const sumRow = {}; T(slots, 'tel', 'tr').forEach(r => sumRow[norm(r[1])] = r[2]);
      const br = T(slots, 'tel', 'tb')[0];
      plants.forEach(p => { const v = unit[norm(p.tel)]; out.tel.plant[p.name] = isN(v) ? v : 'NA'; });
      regs.forEach(rg => { const g = byReg[norm(rg.code)]; out.tel.reg[rg.name] = isN(sumRow[norm(rg.code)]) ? sumRow[norm(rg.code)] : (g && g[1] ? g[0] / g[1] : 'NA'); });
      const tot = Object.values(byReg).reduce((a, g) => [a[0] + g[0], a[1] + g[1]], [0, 0]);
      out.tel.reg['Brasil'] = br ? br[1] : (tot[1] ? tot[0] / tot[1] : 'NA');
      // operadores: média ponderada pela qtd. de empilhadeiras (Telemetria!E); sem pesos -> média simples
      const cnt = {}; u.forEach(r => { if (r[5] != null) cnt[norm(r[5])] = r[3]; });
      ops.forEach(o => {
        let sw = 0, sv = 0; const vs = [];
        plants.filter(p => norm(p.apoio) === norm(o.name)).forEach(p => { const v = pv('tel', p); if (!isN(v)) return; const w = num(cnt[norm(p.tel)]); sw += w; sv += v * w; vs.push(v); });
        out.tel.op[o.name] = sw > 0 ? sv / sw : (vs.length ? sum(vs) / vs.length : 'NA');
      });
    }
    /* Faixas */
    {
      const raw = T(slots, 'faixa', 'r').map(r => ({ g: norm(r[1]), op: norm(r[2]), fx: norm(r[3]), q: r[4] }));
      const CRIT = ['LARANJA', 'VERMELHA', 'ROXA'];
      const crit = f => sum(raw.filter(x => CRIT.includes(x.fx) && f(x)).map(x => x.q));
      const mot = f => qsum(x => x.flag === 1 && f(x));
      plants.forEach(p => { const d = mot(x => x.op === norm(p.op)); out.faixa.plant[p.name] = d ? crit(x => x.op === norm(p.op)) / d : 'NA'; });
      let nT = 0, dT = 0;
      Object.keys(REGS).forEach(rg => { const n = crit(x => x.g === REGS[rg][0]), d = mot(x => x.reg === norm(REGS[rg][1])); nT += n; dT += d; out.faixa.reg[rg] = d ? n / d : 'NA'; });
      out.faixa.reg['Brasil'] = dT ? nT / dT : 'NA';
      const tab = {}; T(slots, 'faixa', 'o').forEach(r => tab[norm(r[2])] = r[3]);
      ops.forEach(o => { const d = mot(x => x.emp === norm(o.name)); out.faixa.op[o.name] = d && tab[norm(o.name)] != null ? tab[norm(o.name)] / d : 'NA'; });
    }
    /* Estouro 12h */
    {
      const raw = T(slots, 'est', 'r').map(r => ({ u: norm(r[1]), op: norm(r[2]), emp: norm(r[3]), j: r[4], q: r[5] }));
      plants.forEach(p => { const x = raw.find(r => r.op === norm(p.op)); out.est.plant[p.name] = x ? (x.q ? x.j / x.q : 0) : 0; });
      const den = f => qsum(x => x.cargo === LOGI && f(x));
      let nT = 0, dT = 0;
      Object.keys(REGS).forEach(rg => { const n = sum(raw.filter(x => x.u === norm(REGS[rg][1])).map(x => x.j)), d = den(x => x.reg === norm(REGS[rg][1])); nT += n; dT += d; out.est.reg[rg] = d ? n / d : 'NA'; });
      out.est.reg['Brasil'] = dT ? nT / dT : 'NA';
      ops.forEach(o => { const n = sum(raw.filter(x => x.emp === norm(o.name)).map(x => x.j)), d = den(x => x.emp === norm(o.name)); out.est.op[o.name] = d ? n / d : 'NA'; });
    }
    /* Liderança */
    {
      const nA = x => x == null ? '' : String(x).toUpperCase().replace(/\s+/g, ' ').trim(); // SUMIF/XLOOKUP do Excel: ignora caixa, mas diferencia acentos
      const lid = T(slots, 'lid', 'r').map(r => ({ reg: norm(r[1]), emp: norm(r[2]), op: nA(r[3]), TT: r[4], meta: r[5] }));
      const gRows = T(slots, 'lid', 'g');
      const dep = { 'ESTÂNCIA': 'SERGIPE', 'JAGUARIUNA': 'JAGUARIÚNA', 'LATAS SETE LAGOAS': 'LATAS MINAS' };
      const dRows = T(slots, 'lid', 'd');
      if (dRows.length) Object.keys(dep).forEach(k => delete dep[k]);
      dRows.forEach(r => dep[nA(r[1])] = nA(r[2]));
      // pivô por operação: soma de monitoramentos e metas ajustadas; geo vem do pivô (AP) quando existe
      const pivNames = gRows.length ? gRows.map(r => nA(r[2])) : [...new Set(lid.map(x => x.op))];
      const geoOf = {}; if (gRows.length) gRows.forEach(r => geoOf[nA(r[2])] = norm(r[1])); else lid.forEach(x => geoOf[x.op] = x.reg);
      const piv = {}; pivNames.forEach(n => { const l = lid.filter(x => x.op === n); piv[n] = { TT: sum(l.map(x => x.TT)), meta: sum(l.map(x => x.meta)) }; });
      const pr = n => { const k = piv[dep[n] || n]; return k ? (k.meta ? Math.min(1, k.TT / k.meta) : 'NA') : undefined; };
      plants.forEach(p => { let v = pr(nA(p.op)); if (v === undefined) v = pr(nA(p.logon)); out.lid.plant[p.name] = v === undefined ? 0 : v; });
      const agg = f => { const ns = pivNames.filter(f); const t = sum(ns.map(n => piv[n].TT)), m = sum(ns.map(n => piv[n].meta)); return m ? t / m : 'NA'; };
      Object.keys(REGS).forEach(rg => out.lid.reg[rg] = agg(n => geoOf[n] === norm(REGS[rg][0])));
      out.lid.reg['Brasil'] = agg(() => true);
      const ratio = (TT, meta) => { if (!TT) return 1; return meta / TT < 1 ? 1 : TT / meta; };
      const grp = f => { const l = lid.filter(f); return ratio(sum(l.map(x => x.TT)), sum(l.map(x => x.meta))); };
      ops.forEach(o => { out.lid.op[o.name] = lid.some(x => x.emp === norm(o.name)) ? grp(x => x.emp === norm(o.name)) : 'NA'; });
    }
    /* DTO com desvio */
    {
      const dto = T(slots, 'dto', 'r').map(r => ({ reg: norm(r[1]), emp: norm(r[2]), op: norm(r[3]), real: r[4], com: r[5], pct: r[6] }));
      const ratio = l => { const re = sum(l.map(x => x.real)); return re ? sum(l.map(x => x.com)) / re : 'NA'; };
      plants.forEach(p => {
        const l = dto.filter(x => x.op === norm(p.op));
        out.dto.plant[p.name] = l.length ? ratio(l) : 'NA';
      });
      Object.keys(REGS).forEach(rg => out.dto.reg[rg] = ratio(dto.filter(x => x.reg === REGS[rg][0])));
      out.dto.reg['Brasil'] = ratio(dto);
      ops.forEach(o => out.dto.op[o.name] = ratio(dto.filter(x => x.emp === norm(o.name))));
    }
    /* LogOn */
    {
      const lg = T(slots, 'logon', 'r').map(r => ({ canal: r[1], reg: norm(r[2]), emp: norm(r[3]), op: norm(r[4]), num: r[5], den: r[6], pct: r[7] }));
      const ratio = l => { const d = sum(l.map(x => x.den)); return d ? sum(l.map(x => x.num)) / d : 'NA'; };
      plants.forEach(p => { const l = lg.filter(x => x.op === norm(p.logon)); out.logon.plant[p.name] = l.length ? ratio(l) : 'NA'; });
      regs.forEach(rg => out.logon.reg[rg.name] = ratio(lg.filter(x => x.reg === norm(rg.name))));
      out.logon.reg['Brasil'] = ratio(lg.filter(x => x.canal === 'T1'));
      // operadores: cod -> nome da empresa (LOG ON SEG!L:M) e soma por empresa (coluna C)
      const mp = {}; T(slots, 'logon', 'm').forEach(r => mp[r[1]] = norm(r[2]));
      ops.forEach(o => { const nm = mp[o.cod] || norm(o.name); out.logon.op[o.name] = ratio(lg.filter(x => x.emp === nm)); });
    }
    /* Guardian */
    {
      const byKey = {}, byCod = {}; const pr = T(slots, 'guard', 'p');
      pr.forEach(r => byKey[norm(r[1])] = r[2]);
      T(slots, 'guard', 'o').forEach(r => byCod[r[1]] = r[2]);
      plants.forEach(p => { const v = byKey[norm(p.gkey)]; out.guard.plant[p.name] = isN(v) ? v : 'NA'; });
      // regionais e Brasil: soma de relatos / soma de QLP da base (não é média das plantas)
      const hasHI = pr.length && pr.every(r => isN(r[4]) && isN(r[5]));
      const rat = l => { const d = sum(l.map(r => r[5])); return d ? sum(l.map(r => r[4])) / d : 'NA'; };
      regs.forEach(rg => {
        if (hasHI) out.guard.reg[rg.name] = rat(pr.filter(r => norm(r[3]) === norm(rg.name)));
        else { const v = plants.filter(p => norm(p.reg) === norm(rg.name)).map(p => out.guard.plant[p.name]).filter(isN); out.guard.reg[rg.name] = v.length ? sum(v) / v.length : 'NA'; }
      });
      if (hasHI) out.guard.reg['Brasil'] = rat(pr);
      else { const rv = regs.map(r => out.guard.reg[r.name]).filter(isN); out.guard.reg['Brasil'] = rv.length ? sum(rv) / rv.length : 'NA'; }
      ops.forEach(o => { out.guard.op[o.name] = isN(byCod[o.cod]) ? byCod[o.cod] : 'NA'; });
    }
    /* OKR */
    {
      const byName = {}; T(slots, 'okr', 'r').forEach(r => byName[norm(r[1])] = r[2]);
      plants.forEach(p => { let v = byName[norm(p.name)]; if (!isN(v)) v = byName[norm(p.op)]; out.okr.plant[p.name] = isN(v) ? v : 'NA'; });
      regs.forEach(rg => { const v = byName[norm(rg.name)]; out.okr.reg[rg.name] = isN(v) ? v : 'NA'; });
      out.okr.reg['Brasil'] = isN(byName['BRASIL']) ? byName['BRASIL'] : 'NA';
      // operadores: valor da própria aba OKR; sem linha, média das plantas do operador
      ops.forEach(o => {
        const own = byName[norm(o.name)];
        if (isN(own)) { out.okr.op[o.name] = own; return; }
        const v = plants.filter(p => norm(p.push) === norm(o.name)).map(p => pv('okr', p)).filter(isN); out.okr.op[o.name] = v.length ? sum(v) / v.length : 'NA';
      });
    }
    /* Novatos */
    {
      const nv = T(slots, 'nov', 'r').map(r => ({ reg: norm(r[1]), emp: norm(r[2]), op: norm(r[3]), elig: r[4], nao: r[5] }));
      const ratio = l => { const e = sum(l.map(x => x.elig)); return e ? sum(l.map(x => x.nao)) / e : 'NA'; };
      plants.forEach(p => out.nov.plant[p.name] = ratio(nv.filter(x => x.op === norm(p.op))));
      Object.keys(REGS).forEach(rg => out.nov.reg[rg] = ratio(nv.filter(x => x.reg === REGS[rg][0])));
      out.nov.reg['Brasil'] = ratio(nv);
      ops.forEach(o => out.nov.op[o.name] = ratio(nv.filter(x => x.emp === norm(o.name))));
    }
    return out;
  }


  /* ---------------- pontuação ---------------- */

  async function readWorkbooks(files) {
    const sheets = {}; const found = [];
    for (const f of files) {
      const buf = await f.arrayBuffer();
      const names = XLSX.read(buf, { type: 'array', bookSheets: true }).SheetNames;
      const want = names.filter(n => E.SLOTS.some(sl => sl.sheets.some(x => E.norm(x) === E.norm(n))));
      if (!want.length) continue;
      const wb = XLSX.read(buf, { type: 'array', sheets: want, cellDates: false });
      want.forEach(n => { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: undefined, blankrows: true }); found.push(n); });
    }
    return sheets;
  }
  function uploadDialog(files, onlySlot) {
    const m = S.month;
    $('#dlgInner').innerHTML = `<header><div><div class="eyebrow">${mLong(m)}</div><h2>Lendo planilha</h2></div></header><div class="body"><div class="progress"><i style="width:30%"></i></div><div class="muted">Isso pode levar alguns segundos.</div></div>`;
    $('#dlg').showModal();
    readWorkbooks(files).then(sheets => {
      let ex = E.extractAll(sheets);
      if (onlySlot) ex = Object.fromEntries(Object.entries(ex).filter(([k]) => k === onlySlot));
      const keys = Object.keys(ex);
      if (!keys.length) { $('#dlgInner').innerHTML = `<header><h2>Nenhuma aba reconhecida</h2></header><div class="body"><div class="notice err">Não encontrei abas como QLP, Telemetria, FAIXAS, ESTOURO 12, MONITORAMENTO_LIDERANÇA, DTO_ DESVIOS, LOG ON SEG, Base Guardian, OKR Rollover ou DTO_NOVOS.</div></div><footer><button class="btn" id="dlgClose">Fechar</button></footer>`; $('#dlgClose').onclick = () => $('#dlg').close(); return; }
      const missing = E.SLOTS.filter(sl => !ex[sl.id] && !(onlySlot) && !(slotsFor(m) && slotsFor(m)[sl.id]));
      const rows = E.SLOTS.map(sl => { const x = ex[sl.id]; return `<tr><td>${esc(sl.nome)}</td><td>${x ? esc(x.sheet) : '–'}</td><td class="num">${x ? x.rows.length : 0}</td><td>${x ? (x.layout.length ? `<span style="color:var(--mid)">Confira colunas ${esc(x.layout.join(', '))}</span>` : 'ok') : '<span class="muted">não enviada</span>'}</td></tr>`; }).join('');
      $('#dlgInner').innerHTML = `<header><div><div class="eyebrow">Bases do mês</div><h2>Carregar em ${mLong(m)}</h2></div><button class="btn small" id="dlgClose">Cancelar</button></header>
        <div class="body"><div class="tablebox"><table><thead><tr><th>Base</th><th>Aba</th><th>Linhas</th><th>Layout</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${missing.length ? `<div class="notice warn">Faltam ${missing.length} base(s): ${esc(missing.map(x => x.nome).join(', '))}. Os KPIs ligados a elas ficam NA até você carregá-las.</div>` : ''}
        <div class="filters"><label for="perSel">Base de</label><select id="perSel"><option value="1Q">1Q (parcial, até dia 15)</option><option value="2Q" ${/^(?:\d{4}-\d{2})$/.test(m) ? '' : ''}>2Q (fechamento do mês)</option></select></div></div>
        <footer><button class="btn primary" id="upConfirm">Usar estas bases</button></footer>`;
      $('#dlgClose').onclick = () => $('#dlg').close();
      $('#upConfirm').onclick = () => {
        const cur = Object.assign({}, slotsFor(m) || {});
        keys.forEach(k => { cur[k] = ex[k]; });
        S.ver++; S.slotsCache[m] = cur; S.pending = { m, slots: keys, periodo: $('#perSel').value };
        S.results[m] = Object.assign({}, S.results[m] || {}, { periodo: $('#perSel').value });
        $('#dlg').close(); render(); toast('Bases carregadas. Confira o ranking e clique em Salvar apuração.');
      };
    }).catch(e => { $('#dlgInner').innerHTML = `<header><h2>Erro ao ler</h2></header><div class="body"><div class="notice err">${esc(e.message || e)}</div></div><footer><button class="btn" id="dlgClose">Fechar</button></footer>`; $('#dlgClose').onclick = () => $('#dlg').close(); });
  }

  /* ------------------------------------------------------------------ persistência */
  function resultDoc(m) {
    const r = getRes(m); const ent = {};
    Object.keys(r.ent).forEach(k => { ent[k] = {}; Object.entries(r.ent[k]).forEach(([n, e]) => { ent[k][n] = [isN(e.total) ? +e.total.toFixed(6) : null, e.rank || null, e.vals ? e.vals.map(v => isN(v) ? +(+v).toFixed(6) : 'NA') : null, e.pts ? e.pts.map(p => isN(p) ? +p.toFixed(4) : null) : null]; }); });
    return { month: m, mode: r.mode, periodo: (S.results[m] && S.results[m].periodo) || null, q: r.q, ent, savedAt: new Date().toISOString() };
  }
  async function save(m, extra) {
    if (!S.store) { toast('Armazenamento indisponível.'); return; }
    const ops = [];
    const slots = S.slotsCache[m];
    if (slots) Object.entries(slots).forEach(([sid, x]) => ops.push({ type: 'input', m, slot: sid, fields: ['v'], rows: [{ v: JSON.stringify(x.rows) }], meta: { sheet: x.sheet, rowsCount: x.rows.length, layout: x.layout || [], savedAt: new Date().toISOString() }, oldChunks: (S.inputsMeta && S.inputsMeta[m] && S.inputsMeta[m][sid] && S.inputsMeta[m][sid].chunks) || 0 }));
    const doc = resultDoc(m); ops.push({ type: 'result', m, doc });
    ops.push({ type: 'overrides', m, items: S.overrides[m] || {} });
    ops.push({ type: 'scoring', doc: S.qcfg });
    const bar = document.createElement('div'); bar.className = 'toast'; bar.textContent = 'Salvando…'; document.body.appendChild(bar);
    try { await S.store.saveBatch(ops); S.ver++; S.results[m] = doc; S.pending = null; bar.remove(); toast('Apuração de ' + mLabel(m) + ' salva.'); }
    catch (e) { bar.remove(); toast('Não foi possível salvar: ' + (e.message || e.code || e)); }
    render();
  }
  async function loadMonthInputs(m) {
    if (S.slotsCache[m] || !S.store) return;
    try {
      const metas = await S.store.inputsMeta(m); if (!Object.keys(metas).length) return;
      S.inputsMeta = S.inputsMeta || {}; S.inputsMeta[m] = metas;
      const raw = await S.store.loadInputs(m, metas); const slots = {};
      Object.entries(raw).forEach(([sid, rows]) => { try { const rr = rows.map(r => JSON.parse(r.v)).flat(); slots[sid] = { rows: rr, sheet: metas[sid].sheet, layout: metas[sid].layout || [] }; } catch (e) { } });
      if (Object.keys(slots).length) { S.slotsCache[m] = slots; S.ver++; }
    } catch (e) { }
  }

      const [k, n] = v.querySelector('#ovEnt').value.split('|'); const kp = v.querySelector('#ovKpi').value; let val = v.querySelector('#ovVal').value.trim().replace(',', '.');
      if (!val) { toast('Informe o valor ou NA.'); return; } const x = val.toUpperCase() === 'NA' ? 'NA' : parseFloat(val); if (x !== 'NA' && !isN(x)) { toast('Valor inválido.'); return; }
      S.ver++; S.overrides[S.month] = Object.assign({}, S.overrides[S.month] || {}, { [`${kindOf[k]}|${n}|${kp}`]: { v: x, note: v.querySelector('#ovNote').value.trim() } }); render();
    };
    v.querySelectorAll('[data-delov]').forEach(b => b.onclick = () => { const o = Object.assign({}, S.overrides[S.month] || {}); delete o[b.dataset.delov]; S.ver++; S.overrides[S.month] = o; render(); });
    const qe = v.querySelector('#qEdit'); if (qe) qe.onclick = () => { S.editRegua = true; render(); };
    const qx = v.querySelector('#qCancel'); if (qx) qx.onclick = () => { S.editRegua = false; render(); };
    const qs = v.querySelector('#qSave'); if (qs) qs.onclick = () => {
      const q = JSON.parse(JSON.stringify(qFor(S.month))); let bad = false;
      v.querySelectorAll('.qinp').forEach(i => { const x = parseFloat(String(i.value).replace(',', '.')); if (!isN(x)) bad = true; else q[+i.dataset.k][+i.dataset.j] = x; });
      if (bad) { toast('Há limiares inválidos.'); return; }
      S.ver++; S.editRegua = false; S.qcfg = { byMonth: Object.assign({}, S.qcfg.byMonth, { [S.month]: q }) }; render(); toast('Limiares aplicados. Salve a apuração para gravar.');
    };
    const qc = v.querySelector('#qCopy'); if (qc) qc.onchange = () => { if (!qc.value) return; const src = S.qcfg.byMonth[qc.value] || SEED.q[qc.value]; S.ver++; S.qcfg = { byMonth: Object.assign({}, S.qcfg.byMonth, { [S.month]: JSON.parse(JSON.stringify(src)) }) }; render(); };
  }
  function wire() {
    $('#monthSel').onchange = async e => { S.month = e.target.value; await loadMonthInputs(S.month); render(); };
    $('#vMes').onclick = () => { S.view = 'mes'; render(); }; $('#vAno').onclick = () => { S.view = 'ano'; S.tab = 'ranking'; render(); };
    ['ranking', 'resumo', 'bases', 'regras'].forEach(t => $('#tab_' + t).onclick = () => { S.tab = t; render(); });
    $('#ghBtn').onclick = githubDialog;
    $('#addMonth').onchange = e => { const v = e.target.value; if (/^\d{4}-\d{2}$/.test(v)) { if (!S.extraMonths.includes(v)) S.extraMonths.push(v); S.month = v; render(); } };
    $('#fileAll').onchange = e => { if (e.target.files.length) uploadDialog(Array.from(e.target.files)); };
    $('#fileOne').onchange = e => { if (e.target.files.length) uploadDialog(Array.from(e.target.files), S.upSlot); };
    $('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
  }

  /* ------------------------------------------------------------------ início */
  async function init() {
    wire();
    S.month = '2026-09';
    render();
    const gh = ST.githubConfig();
    try {
      if (gh) { S.store = ST.githubStore(gh); S.storeKind = 'github'; await S.store.init(); S.canWrite = !!S.store.canWrite; }
      else {
        const c = window.claude;
        const [db, user] = await Promise.all([c && c.use ? c.use('db').catch(() => null) : null, c && c.use ? c.use('user').catch(() => null) : null]);
        if (db) { S.store = ST.claudeStore(db, user); await S.store.init(); S.canWrite = S.store.canWrite !== false; }
        else S.canWrite = false;
      }
      if (S.store) {
        S.ver++; S.results = await S.store.listResults().catch(() => ({}));
        S.overrides = await S.store.listOverrides().catch(() => ({}));
        const sc = await S.store.getScoring().catch(() => null); if (sc && sc.byMonth) S.qcfg = sc;
        const ms = Object.keys(S.results).sort(); if (ms.length && ms[ms.length - 1] > S.month) S.month = ms[ms.length - 1];
        await loadMonthInputs(S.month);
      }
    } catch (e) { $('#globalNotice').innerHTML = `<div class="notice warn">Não consegui abrir o armazenamento (${esc(e.message || e.code || e)}). Você pode consultar os dados incluídos, mas não salvar.</div>`; S.canWrite = false; }
    render();
  }
  init();
})();

</script>

</body></html>
