    const m = S.month, r = getRes(m);
    const lvSeg = `<div class="seg" role="group" aria-label="Nível do resumo">${RZ_LV.map(([k, l]) => `<button data-rzlv="${k}" aria-pressed="${S.rzLevel === k}">${l}</button>`).join('')}</div>`;
    const opts = rzNames(S.rzLevel);
    if (!opts.includes(S.rzEnt)) S.rzEnt = opts[0] === 'Regional NE' ? 'Brasil' : opts[0];
    const order = S.rzLevel === 'reg' ? ['Brasil', ...opts.filter(x => x !== 'Brasil')] : opts;
    const sel = `<select id="rzEnt" aria-label="Escolher ${RZ_LV.find(x => x[0] === S.rzLevel)[1].toLowerCase()}">${order.map(n => `<option ${n === S.rzEnt ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
    const y = m.slice(0, 4), curMo = +m.slice(5);
    const head = `<div class="section-head"><div><div class="eyebrow">Performance de segurança ${y}</div><h2>Resumo por ${RZ_LV.find(x => x[0] === S.rzLevel)[1].toLowerCase()}</h2></div><div class="filters">${lvSeg}${sel}</div></div>`;
    if (!r) return `<section class="section">${head}</section><div class="empty">Sem dados para este mês.</div>`;
    const k = S.rzLevel, n = S.rzEnt, e = r.ent[k][n];
    const rows = allMonths().filter(x => x.startsWith(y) && x <= m).map(x => { const rr = getRes(x); const ee = rr && rr.ent[k][n]; return { m: x, mo: +x.slice(5), e: ee }; }).filter(x => x.e && isN(x.e.total) && x.e.total > 0);
    const det = rows.filter(x => x.e.vals && x.e.pts);
    const byMo = Object.fromEntries(rows.map(x => [x.mo, x.e]));
    // desempenho médio por KPI (0–12,22) = total ÷ 9 (o total já é reescalado para 110)
    const avgPts = rows.map(x => [x.mo, x.e.total / 9]);
    const fit = linFit(avgPts), lastMo = avgPts.length ? avgPts[avgPts.length - 1][0] : null;
    const proj = projOf(avgPts, fit);
    const yearAvg = avgPts.length ? avgPts.reduce((a, p) => a + p[1], 0) / avgPts.length : null;
    const per = rows.length ? `${MESES[rows[0].mo - 1]}–${MESES[rows[rows.length - 1].mo - 1]} ${y}` : '–';
    const info = k === 'plant' ? plantInfo(n) : null;
    const lvl = RZ_LV.find(x => x[0] === k)[1];
    const tiles = `<div class="tiles"><div class="tile"><span class="eyebrow">Visão atual</span><b>${esc(n)}</b><span class="muted">${info ? esc(info.reg + ' · ' + info.apoio) : lvl}</span></div>
      <div class="tile"><span class="eyebrow">${mLong(m)}${r.periodo ? ' · ' + r.periodo : ''}</span><b class="num">${fmtT(e && e.total)}<small> / 110</small></b><span class="muted">${!e ? 'sem apuração no mês' : n === 'Brasil' ? 'Total Brasil' : (e.rank ? e.rank + 'º no ranking do mês' : '')}</span></div>
      <div class="tile"><span class="eyebrow">Média ${y} por KPI</span><b class="num">${yearAvg == null ? '–' : fmtT(yearAvg)}<small> / ${fmtT(PTS)}</small></b><span class="muted">Período realizado: ${per}</span></div>
      <div class="tile"><span class="eyebrow">Projeção para dezembro</span><b class="num">${fit && lastMo < 12 ? fmtT(fit(12)) : '–'}<small> / ${fmtT(PTS)}</small></b><span class="muted">Tendência linear dos meses realizados</span></div></div>`;
    const bars = e && e.vals ? kpiBars(e, r.q) : `<div class="empty">Sem KPIs abertos em ${mLong(m)}.</div>`;
    // indicadores e pontos por mês
    const allMo = Array.from({ length: 12 }, (_, i) => i + 1);
    const cc = mo => mo === curMo ? 'curm' : '';
    const kAvg = (i, f) => { const xs = det.map(x => x.e[f][i]).filter(isN); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
    const tbl = `<div class="tablebox"><table class="rztable"><thead><tr><th>Indicador</th><th>Média ${y}</th>${allMo.map(mo => `<th class="${cc(mo)}">${MESES[mo - 1].charAt(0).toUpperCase() + MESES[mo - 1].slice(1)}</th>`).join('')}</tr></thead><tbody>
      ${KPIS.map((kp, i) => `<tr><td class="name"><div class="n">${esc(kp.nome)}</div><div class="s">${kp.dir === 'menor' ? '↓ menor é melhor' : '↑ maior é melhor'}</div></td>
        <td><div class="kc"><span class="v">${kAvg(i, 'vals') == null ? '–' : fmtV(i, kAvg(i, 'vals'))}</span>${kAvg(i, 'pts') == null ? '' : `<span class="pt ${tierCls(tierFromPts(kAvg(i, 'pts')))}">${fmtP(kAvg(i, 'pts'))}</span>`}</div></td>
        ${allMo.map(mo => { const x = byMo[mo]; if (!x || !x.vals) return `<td class="muted ${cc(mo)}">${x ? '·' : ''}</td>`;
          const ov = S.overrides[y + '-' + String(mo).padStart(2, '0')] || {}; const man = Object.keys(ov).some(kk => kk === `${kindOf[k]}|${n}|${kp.id}`);
          return `<td class="${cc(mo)}"><div class="kc"><span class="v">${isN(x.vals[i]) ? fmtV(i, x.vals[i]) : 'sem dado'}${man ? ' <span class="man">manual</span>' : ''}</span><span class="pt ${tierCls(x.tiers ? x.tiers[i] : null)}">${isN(x.pts[i]) ? fmtP(x.pts[i]) : 'NA'}</span></div></td>`; }).join('')}</tr>`).join('')}
      <tr class="brasil"><td>Média total (pts por KPI)</td><td class="num">${yearAvg == null ? '–' : fmtT(yearAvg)}</td>${allMo.map(mo => { const x = byMo[mo]; return `<td class="num ${cc(mo)}">${x ? fmtT(x.total / 9) : ''}</td>`; }).join('')}</tr>
      <tr><td>Total do mês (0–110)</td><td></td>${allMo.map(mo => { const x = byMo[mo]; return `<td class="num ${cc(mo)}">${x ? fmtT(x.total) + (x.rank && n !== 'Brasil' ? `<div class="muted" style="font-size:.72rem">${x.rank}º</div>` : '') : ''}</td>`; }).join('')}</tr>
      </tbody></table></div>
      <p class="muted" style="font-size:.8rem">"·" = mês sem os KPIs abertos. Total do mês = resultado oficial dos arquivos 2Q até agosto e cálculo do sistema em setembro e outubro. Fev a abr equalizados de 180 para 110 pontos.</p>`;
    // pequenos múltiplos por KPI
    const mult = KPIS.map((kp, i) => {
      const real = det.filter(x => isN(x.e.pts[i])).map(x => [x.mo, x.e.pts[i]]);
      const f = linFit(real); const last = real.length ? real[real.length - 1][1] : null;
      return `<div class="mult"><div class="mh"><span>${KSHORT[kp.id]}</span>${last == null ? '<span class="muted">–</span>' : `<span class="pt ${tierCls(tierFromPts(last))}">${fmtP(last)}</span>`}</div>${lineChart({ real, proj: projOf(real, f) }, { small: true, w: 220, h: 80, label: 'Tendência ' + kp.nome })}<div class="muted mf">${real.length < 2 ? 'Projeção a partir de 2 meses com KPIs abertos' : `Projeção dez: ${fmtT(f(12))} pts`}</div></div>`;
    }).join('');
    let extra = '';
    if (k === 'reg' && n === 'Brasil') {
      const plants = Object.entries(r.ent.plant).filter(([, x]) => isN(x.total)).sort((a, b) => (a[1].rank && b[1].rank && a[1].rank !== b[1].rank) ? a[1].rank - b[1].rank : b[1].total - a[1].total);
      const row = ([nn, x]) => `<tr data-k="plant" data-n="${esc(nn)}"><td class="rk">${rankTxt(x.rank)}</td><td>${esc(nn)}</td><td class="num">${fmtT(x.total)}</td></tr>`;
      extra = `<div class="rzgrid"><div class="card"><h3>Cinco melhores plantas</h3><table class="rztable"><tbody>${plants.slice(0, 5).map(row).join('')}</tbody></table></div><div class="card"><h3>Cinco plantas com menor pontuação</h3><table class="rztable"><tbody>${plants.slice(-5).reverse().map(row).join('')}</tbody></table></div></div>`;
    }
    return `<section class="section">${head}${tiles}</section>
      <div class="rzgrid">
        <section class="section card"><div><h3>Performance média — realizado e projeção</h3><div class="muted">Pontuação média por KPI (0–${fmtT(PTS)}) · <span class="key"></span> realizado <span class="key proj"></span> projeção linear</div></div>${lineChart({ real: avgPts, proj }, { label: 'Performance média mensal' })}</section>
        <section class="section card"><div><h3>KPIs em ${mLong(m)}</h3><div class="muted">Do melhor para o pior, em pontos (0–${fmtP(PTS)})</div></div>${bars}</section>
      </div>
      <section class="section"><div><div class="eyebrow">Acompanhamento mensal</div><h2>Indicadores e pontos</h2></div>${tbl}</section>
      <section class="section"><div><div class="eyebrow">Tendência anual</div><h2>Pontos por KPI — realizado e projeção</h2></div><div class="multiples">${mult}</div></section>` + extra;
  }

  /* ------------------------------------------------------------------ bases do mês */
  function renderBases() {
    const m = S.month; const slots = slotsFor(m); const st = S.results[m];
    const embedded = !S.slotsCache[m] && SEED_INPUTS[m];
    const cards = E.SLOTS.map(sl => {
      const x = slots && slots[sl.id];
      const warn = x && x.layout && x.layout.length ? `<div class="meta" style="color:var(--mid)">Colunas fora do lugar esperado: ${esc(x.layout.join(', '))}. Confira o layout da aba.</div>` : '';
      return `<div class="slot"><span class="dot ${x ? 'ok' : ''}"></span><div><div class="lbl">${esc(sl.nome)}</div><div class="meta">${x ? esc(x.sheet) + ' · ' + x.rows.length + ' linhas' : 'Aba ' + esc(sl.sheets[0]) + ' não carregada'}</div>${warn}<div class="chips">${sl.kpis.map(k => `<span class="chip">${esc(KPIS.find(z => z.id === k).nome)}</span>`).join('')}</div></div><div class="acts"><button class="btn small" data-up="${sl.id}" ${S.canWrite ? '' : 'disabled'}>Trocar</button></div></div>`;
    }).join('');
    const ovs = Object.entries(S.overrides[m] || {});
    const ovRows = ovs.map(([key, x]) => { const [k, n, kp] = key.split('|'); const v = x && typeof x === 'object' ? x.v : x; return `<tr><td>${esc(n)}</td><td>${esc(KPIS.find(z => z.id === kp).nome)}</td><td class="num">${v === 'NA' ? 'NA' : esc(v)}</td><td class="muted">${esc((x && x.note) || '')}</td><td><button class="btn small" data-delov="${esc(key)}" ${S.canWrite ? '' : 'disabled'}>Remover</button></td></tr>`; }).join('');
    const allEnt = [['reg', MASTER.regs.map(r => r.name)], ['op', MASTER.ops.map(o => o.name)], ['plant', MASTER.plants.map(p => p.name)]].flatMap(([k, ns]) => ns.map(n => `<option value="${k}|${esc(n)}">${esc(n)} (${KINDS.find(z => z[0] === k)[1].toLowerCase()})</option>`)).join('');
    return `<div class="status-bar"><div><div class="eyebrow">${mLong(m)}</div><h2>Bases do mês</h2><div class="muted">${slots ? (embedded ? 'Bases de ' + mLabel(m) + ' incluídas com o sistema. Carregue uma planilha nova para substituir.' : 'Bases salvas para este mês.') : 'Nenhuma base carregada. Carregue a planilha do termômetro (todas as abas de uma vez).'}</div></div><div class="filters"><button class="btn primary" id="upAll" ${S.canWrite ? '' : 'disabled'}>Carregar planilha do mês</button><button class="btn" id="saveBtn" ${S.canWrite && slots ? '' : 'disabled'}>Salvar apuração</button></div></div>
      ${S.canWrite ? '' : `<div class="notice warn">${S.canWriteBase ? 'Seu perfil (' + esc(ROLES[S.acl.role] || '') + ') não permite carregar bases nem salvar a apuração.' : 'Você está em modo leitura. Só quem tem permissão de edição grava dados.'}</div>`}
      <div class="grid-kpi"><div class="kcard"><header><h3>Abas lidas</h3><span class="muted">${st ? 'salvo ' + new Date(st.savedAt).toLocaleDateString('pt-BR') : 'não salvo'}</span></header>${cards}</div>
      <div class="kcard"><header><h3>Valores manuais</h3><span class="muted">${ovs.length} no mês</span></header><div class="muted">Sobrescreve o valor calculado de um KPI para uma entidade no mês. Use NA para tirar o KPI da conta. Fica registrado com a observação.</div>
        ${ovs.length ? `<div class="tablebox"><table><thead><tr><th>Entidade</th><th>KPI</th><th>Valor</th><th>Obs.</th><th></th></tr></thead><tbody>${ovRows}</tbody></table></div>` : ''}
        <div class="manin" style="flex-wrap:wrap"><select id="ovEnt" aria-label="Entidade">${allEnt}</select><select id="ovKpi" aria-label="KPI">${KPIS.map(k => `<option value="${k.id}">${esc(k.nome)}</option>`).join('')}</select><input type="text" id="ovVal" placeholder="valor ou NA" aria-label="Valor" style="width:120px"><input type="text" id="ovNote" placeholder="observação" aria-label="Observação" style="width:180px"><button class="btn small" id="ovAdd" ${S.canWrite ? '' : 'disabled'}>Adicionar</button></div>
        <div class="muted">Percentuais entram como decimal (0,85 = 85%).</div></div></div>`;
  }
  async function readWorkbooks(files) {
    const sheets = {}; const found = [];
    for (const f of files) {
      const buf = await f.arrayBuffer();
      const names = XLSX.read(buf, { type: 'array', bookSheets: true }).SheetNames;
      const want = names.filter(n => E.SLOTS.some(sl => sl.sheets.some(x => E.norm(x) === E.norm(n))));
      if (!want.length) continue;
      const wb = XLSX.read(buf, { type: 'array', sheets: want, cellDates: false });
      want.forEach(n => { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: undefined, blankrows: true }); found.push(n); });
    }
    return sheets;
  }
  function uploadDialog(files, onlySlot) {
    if (!S.canWrite) { toast('Seu perfil não permite carregar bases.'); return; }
    const m = S.month;
    $('#dlgInner').innerHTML = `<header><div><div class="eyebrow">${mLong(m)}</div><h2>Lendo planilha</h2></div></header><div class="body"><div class="progress"><i style="width:30%"></i></div><div class="muted">Isso pode levar alguns segundos.</div></div>`;
    $('#dlg').showModal();
    readWorkbooks(files).then(sheets => {
      let ex = E.extractAll(sheets);
      if (onlySlot) ex = Object.fromEntries(Object.entries(ex).filter(([k]) => k === onlySlot));
      const keys = Object.keys(ex);
      if (!keys.length) { $('#dlgInner').innerHTML = `<header><h2>Nenhuma aba reconhecida</h2></header><div class="body"><div class="notice err">Não encontrei abas como QLP, Telemetria, FAIXAS, ESTOURO 12, MONITORAMENTO_LIDERANÇA, DTO_ DESVIOS, LOG ON SEG, Base Guardian, OKR Rollover ou DTO_NOVOS.</div></div><footer><button class="btn" id="dlgClose">Fechar</button></footer>`; $('#dlgClose').onclick = () => $('#dlg').close(); return; }
      const missing = E.SLOTS.filter(sl => !ex[sl.id] && !(onlySlot) && !(slotsFor(m) && slotsFor(m)[sl.id]));
      const rows = E.SLOTS.map(sl => { const x = ex[sl.id]; return `<tr><td>${esc(sl.nome)}</td><td>${x ? esc(x.sheet) : '–'}</td><td class="num">${x ? x.rows.length : 0}</td><td>${x ? (x.layout.length ? `<span style="color:var(--mid)">Confira colunas ${esc(x.layout.join(', '))}</span>` : 'ok') : '<span class="muted">não enviada</span>'}</td></tr>`; }).join('');
      $('#dlgInner').innerHTML = `<header><div><div class="eyebrow">Bases do mês</div><h2>Carregar em ${mLong(m)}</h2></div><button class="btn small" id="dlgClose">Cancelar</button></header>
        <div class="body"><div class="tablebox"><table><thead><tr><th>Base</th><th>Aba</th><th>Linhas</th><th>Layout</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${missing.length ? `<div class="notice warn">Faltam ${missing.length} base(s): ${esc(missing.map(x => x.nome).join(', '))}. Os KPIs ligados a elas ficam NA até você carregá-las.</div>` : ''}
        <div class="filters"><label for="perSel">Base de</label><select id="perSel"><option value="1Q">1Q (parcial, até dia 15)</option><option value="2Q" ${/^(?:\d{4}-\d{2})$/.test(m) ? '' : ''}>2Q (fechamento do mês)</option></select></div></div>
        <footer><button class="btn primary" id="upConfirm">Usar estas bases</button></footer>`;
      $('#dlgClose').onclick = () => $('#dlg').close();
      $('#upConfirm').onclick = () => {
        const cur = Object.assign({}, slotsFor(m) || {});
        keys.forEach(k => { cur[k] = ex[k]; });
        S.ver++; S.slotsCache[m] = cur; S.pending = { m, slots: keys, periodo: $('#perSel').value };
        S.results[m] = Object.assign({}, S.results[m] || {}, { periodo: $('#perSel').value });
        $('#dlg').close(); render(); toast('Bases carregadas. Confira o ranking e clique em Salvar apuração.');
      };
    }).catch(e => { $('#dlgInner').innerHTML = `<header><h2>Erro ao ler</h2></header><div class="body"><div class="notice err">${esc(e.message || e)}</div></div><footer><button class="btn" id="dlgClose">Fechar</button></footer>`; $('#dlgClose').onclick = () => $('#dlg').close(); });
  }

  /* ------------------------------------------------------------------ persistência */
  function resultDoc(m) {
    const r = getRes(m); const ent = {};
    Object.keys(r.ent).forEach(k => { ent[k] = {}; Object.entries(r.ent[k]).forEach(([n, e]) => { ent[k][n] = [isN(e.total) ? +e.total.toFixed(6) : null, e.rank || null, e.vals ? e.vals.map(v => isN(v) ? +(+v).toFixed(6) : 'NA') : null, e.pts ? e.pts.map(p => isN(p) ? +p.toFixed(4) : null) : null]; }); });
    return { month: m, mode: r.mode, periodo: (S.results[m] && S.results[m].periodo) || null, q: r.q, ent, savedAt: new Date().toISOString() };
  }
  async function save(m, extra) {
    if (!S.canWrite) { toast('Seu perfil não permite salvar a apuração.'); return; }
    if (!S.store) { toast('Armazenamento indisponível.'); return; }
    const ops = [];
    const slots = S.slotsCache[m];
    if (slots) Object.entries(slots).forEach(([sid, x]) => ops.push({ type: 'input', m, slot: sid, fields: ['v'], rows: [{ v: JSON.stringify(x.rows) }], meta: { sheet: x.sheet, rowsCount: x.rows.length, layout: x.layout || [], savedAt: new Date().toISOString() }, oldChunks: (S.inputsMeta && S.inputsMeta[m] && S.inputsMeta[m][sid] && S.inputsMeta[m][sid].chunks) || 0 }));
    const doc = resultDoc(m); ops.push({ type: 'result', m, doc });
    ops.push({ type: 'overrides', m, items: S.overrides[m] || {} });
    ops.push({ type: 'scoring', doc: S.qcfg });
    const bar = document.createElement('div'); bar.className = 'toast'; bar.textContent = 'Salvando…'; document.body.appendChild(bar);
    try { await S.store.saveBatch(ops); S.ver++; S.results[m] = doc; S.pending = null; bar.remove(); toast('Apuração de ' + mLabel(m) + ' salva.'); }
    catch (e) { bar.remove(); toast('Não foi possível salvar: ' + (e.message || e.code || e)); }
    render();
  }
  async function loadMonthInputs(m) {
    if (S.slotsCache[m] || !S.store) return;
    try {
      const metas = await S.store.inputsMeta(m); if (!Object.keys(metas).length) return;
      S.inputsMeta = S.inputsMeta || {}; S.inputsMeta[m] = metas;
      const raw = await S.store.loadInputs(m, metas); const slots = {};
      Object.entries(raw).forEach(([sid, rows]) => { try { const rr = rows.map(r => JSON.parse(r.v)).flat(); slots[sid] = { rows: rr, sheet: metas[sid].sheet, layout: metas[sid].layout || [] }; } catch (e) { } });
      if (Object.keys(slots).length) { S.slotsCache[m] = slots; S.ver++; }
    } catch (e) { }
  }

  /* ------------------------------------------------------------------ regras */
  function quartisBlock() {
    const m = S.month, q = qFor(m), own = !!S.qcfg.byMonth[m], ed = !!S.editRegua && S.canWrite;
    const prevs = Object.keys(Object.assign({}, SEED.q, S.qcfg.byMonth)).filter(x => x !== m).sort();
    const pts = [PTS, PTS / 2, PTS / 4, 0];
    const cell = (i, j) => {
      const kp = KPIS[i], sign = kp.dir === 'menor' ? '≤' : '≥';
      if (ed) return `<div class="qin"><span class="muted">${sign}</span><input type="text" class="qinp" data-k="${i}" data-j="${j}" value="${q[i][j]}" size="8" aria-label="${esc(kp.nome)} Q${j + 1}"></div>`;
      if (j === 3) return `<span class="muted">demais</span> <span class="pt p0">0 pts</span>`;
      return `<span class="qv">${sign} ${fmtV(i, q[i][j])}</span> <span class="pt ${tierCls(j + 1)}">${fmtP(pts[j])} pts</span>`;
    };
    return `<div class="section-head"><div class="muted" style="max-width:80ch">Quartis por KPI, como na planilha. O 1º quartil que o resultado atinge define os pontos; quem não atinge nenhum fica no Quartil 4 (0 ponto). Valem para ${mLabel(m)}. ${own ? 'Alterados no sistema.' : SEED.q[m] ? 'Vieram da planilha oficial.' : 'Copiados do mês anterior; ajuste se a regra mudou.'}</div>
      <div class="filters">${S.canWrite ? (ed ? `<select id="qCopy" aria-label="Copiar de"><option value="">Copiar de…</option>${prevs.map(x => `<option value="${x}">${mLong(x)}</option>`).join('')}</select><button class="btn" id="qCancel">Cancelar</button><button class="btn primary" id="qSave">Salvar quartis</button>` : '<button class="btn" id="qEdit">Editar quartis</button>') : ''}</div></div>
      ${ed ? '<div class="notice">Percentuais em fração (ex.: 0,95 = 95%). Aplicar recalcula o mês na tela; use Salvar apuração em Bases do mês para gravar.</div>' : ''}
      <div class="tablebox"><table class="rules quartis"><thead><tr><th>KPI</th><th>Hurdle<span class="dir">nota cheia</span></th><th>Quartil 1</th><th>Quartil 2</th><th>Quartil 3</th><th>Quartil 4</th></tr></thead><tbody>
      ${KPIS.map((kp, i) => `<tr><td><b>${esc(kp.nome)}</b><div class="muted">${kp.dir === 'menor' ? '↓ menor é melhor' : '↑ maior é melhor'}</div></td><td><span class="qv">${kp.dir === 'menor' ? '≤' : '≥'} ${fmtV(i, q[i][0])}</span> <span class="pt p11">${fmtP(PTS)} pts</span></td><td>${cell(i, 0)}</td><td>${cell(i, 1)}</td><td>${cell(i, 2)}</td><td>${ed ? cell(i, 3) : '<span class="muted">demais</span> <span class="pt p0">0 pts</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function renderRegras() {
    const cad = MASTER.plants.slice().sort((a, b) => a.reg.localeCompare(b.reg) || a.name.localeCompare(b.name));
    return `<section class="section"><div class="eyebrow">Como cada KPI vira pontos</div><h2>Quartis por KPI</h2>
      <p class="muted" style="max-width:80ch">Cada KPI vale até ${fmtT(PTS)} pontos; o total vai até 110. KPI sem dado fica NA e o total é reescalado proporcionalmente (pontos obtidos × 9 ÷ KPIs com dado). Empate: maior monitoramento de liderança; persistindo, maior índice de relatos Guardian.</p>
      ${quartisBlock()}
      <div class="tablebox"><table class="rules"><thead><tr><th>KPI</th><th>Cálculo</th><th>Período</th><th>Fonte</th></tr></thead><tbody>
      ${KPIS.map(kp => `<tr><td><b>${esc(kp.nome)}</b><div class="muted">${kp.dir === 'menor' ? '↓ menor é melhor' : '↑ maior é melhor'}</div></td><td>${esc(KPI_INFO[kp.id].calculo)}</td><td>${esc(KPI_INFO[kp.id].periodo || 'MTD')}</td><td>${esc(KPI_INFO[kp.id].fonte)}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="section"><div class="eyebrow">Padrão de cálculo</div><h2>Regras adotadas da planilha 2Q SET</h2>
      <p class="muted" style="max-width:80ch">O sistema segue as fórmulas, de-paras e desempates da planilha oficial "Termômetro de Segurança T1 – 2Q SET" (setembro/2026), que é o dado oficial do mês. Pontos de atenção em relação às versões anteriores da planilha:</p>
      <ul class="qlist">${CORRECOES.map(([a, b]) => `<li><b>${esc(a)}:</b> ${esc(b)}</li>`).join('')}</ul></section>
      <section class="section"><div class="eyebrow">Definidas pelo responsável</div><h2>Decisões confirmadas</h2>
      <ul class="qlist">${DECISOES.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
      <section class="section"><div class="eyebrow">Aguardando definição</div><h2>Pendências de regra</h2>
      <ol class="qlist">${PENDENCIAS.map(x => `<li>${esc(x)}</li>`).join('')}</ol></section>
      <section class="section"><div class="eyebrow">Cadastro</div><h2>Plantas no ranking (${cad.length})</h2>
      <div class="tablebox"><table><thead><tr><th>Planta</th><th>Regional</th><th>Apoio logístico</th><th>Empurrada</th><th>Operação</th><th>Centro</th></tr></thead><tbody>
      ${cad.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.reg)}</td><td>${esc(p.apoio)}</td><td>${esc(p.push)}</td><td>${esc(p.op)}</td><td class="num">${esc(p.br || '–')}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="section"><div class="eyebrow">Cadastro</div><h2>Sócios operadores no ranking (${MASTER.ops.length})</h2>
      <div class="tablebox"><table><thead><tr><th>Sócio operador</th><th>Código</th></tr></thead><tbody>${MASTER.ops.map(o => `<tr><td>${esc(o.name)}</td><td class="num">${esc(o.cod)}</td></tr>`).join('')}</tbody></table></div></section>`;
  }

  /* ------------------------------------------------------------------ GitHub */
  function githubDialog() {
    const cfg = ST.githubConfig() || { branch: 'main', dataPath: 'data' };
    $('#dlgInner').innerHTML = `<header><div><div class="eyebrow">Armazenamento</div><h2>GitHub</h2></div><button class="btn small" id="dlgClose">Fechar</button></header>
      <div class="body"><div class="muted">Grava os dados em arquivos JSON do repositório, um commit por ação. O token (fine-grained, permissão Contents: leitura e escrita) fica só neste navegador. Use repositório privado.</div>
      <div class="filters"><input type="text" id="ghOwner" placeholder="dono" value="${esc(cfg.owner || '')}" aria-label="Dono"><input type="text" id="ghRepo" placeholder="repositório" value="${esc(cfg.repo || '')}" aria-label="Repositório"><input type="text" id="ghBranch" placeholder="branch" value="${esc(cfg.branch || 'main')}" aria-label="Branch"><input type="text" id="ghPath" placeholder="pasta" value="${esc(cfg.dataPath || 'data')}" aria-label="Pasta"></div>
      <input type="text" id="ghToken" placeholder="token (opcional para leitura)" value="${esc(cfg.token || '')}" aria-label="Token"></div>
      <footer><button class="btn" id="ghOff">Voltar ao claude.ai</button><button class="btn primary" id="ghOn">Conectar</button></footer>`;
    $('#dlg').showModal(); $('#dlgClose').onclick = () => $('#dlg').close();
    $('#ghOff').onclick = () => { try { localStorage.removeItem('termo.github'); } catch (e) { } location.reload(); };
    $('#ghOn').onclick = () => { ST.saveGithubConfig({ owner: $('#ghOwner').value.trim(), repo: $('#ghRepo').value.trim(), branch: $('#ghBranch').value.trim() || 'main', dataPath: $('#ghPath').value.trim() || 'data', token: $('#ghToken').value.trim() }); location.reload(); };
  }

  /* ------------------------------------------------------------------ acessos (login) */
  const ROLES = { admin: 'Administrador', apuracao: 'Apuração', consulta: 'Consulta' };
  const ROLE_HELP = { admin: 'Consulta, carrega bases, salva a apuração e gerencia os acessos.', apuracao: 'Consulta, carrega bases, ajusta valores e limiares e salva a apuração.', consulta: 'Só consulta ranking, resumo e regras.' };
  const aclTabVisible = () => !!(S.acl.supported && S.acl.canManage);
  function applyAuth() {
    const A = S.acl, au = window.T1Auth; A.supported = !!au; A.denied = false; A.checking = false;
    if (!au) return;
    A.enabled = true; A.role = au.role; A.canManage = au.role === 'admin';
    if (S.canWriteBase === undefined) S.canWriteBase = S.canWrite;
    S.canWrite = !!S.canWriteBase && (A.role === 'admin' || A.role === 'apuracao');
  }
  const gen = () => window.T1Auth.genPassword();
  function askPassword(title, who) {
    return new Promise(res => {
      const d = $('#dlg'); $('#dlgInner').innerHTML = `<header><div><h2>${esc(title)}</h2><div class="muted">${esc(who)}</div></div></header><div class="body"><label for="npw" class="muted">Nova senha (mínimo de 10 caracteres)</label><div class="manin"><input type="text" id="npw" value="${esc(gen())}" style="width:260px" autocomplete="off"><button class="btn small" id="npwGen">Gerar outra</button></div><div class="muted">Anote e envie a senha à pessoa por um canal seguro. Ela não fica visível depois.</div></div><footer><button class="btn" id="npwNo">Cancelar</button><button class="btn primary" id="npwOk">Salvar senha</button></footer>`;
      let done = false; const fin = v => { if (done) return; done = true; d.close(); res(v); };
      $('#npwGen').onclick = () => { $('#npw').value = gen(); };
      $('#npwNo').onclick = () => fin(null); $('#npwOk').onclick = () => fin($('#npw').value);
      d.onclose = () => fin(null); d.showModal();
    });
  }
  function askToken() {
    return new Promise(res => {
      const d = $('#dlg'), au = window.T1Auth, h = au.host || {};
      $('#dlgInner').innerHTML = `<header><div><h2>Token do GitHub</h2><div class="muted">Para gravar os acessos no repositório ${esc((h.owner || '') + '/' + (h.repo || ''))}</div></div></header><div class="body"><div>Crie em GitHub > Settings > Developer settings > Personal access tokens > Fine-grained tokens, só para este repositório, com <b>Contents: Read and write</b>. O token fica guardado apenas neste navegador.</div><input type="password" id="gtk" placeholder="github_pat_..." autocomplete="off" style="width:100%"></div><footer><button class="btn" id="gtkNo">Cancelar</button><button class="btn primary" id="gtkOk">Guardar token</button></footer>`;
      let done = false; const fin = v => { if (done) return; done = true; d.close(); res(v); };
      $('#gtkNo').onclick = () => fin(null); $('#gtkOk').onclick = () => fin(($('#gtk').value || '').trim() || null);
      d.onclose = () => fin(null); d.showModal();
    });
  }
  async function saveGh(au) {
    if (!au.hasToken()) { const t = await askToken(); if (!t) { toast('Sem token, a alteração não foi salva no GitHub.'); return false; } au.setToken(t); }
    try { await au.saveRemote(); toast('Salvo no GitHub. Vale para todos em instantes.'); return true; }
    catch (e) { if (e && (e.status === 401)) { au.setToken(''); } toast(e && e.message || 'Não consegui salvar no GitHub.'); return false; }
  }
  function renderAcessos() {
    const au = window.T1Auth, us = au.users(), pend = au.dirty, gh = au.mode === 'github';
    const rows = us.map(u => `<tr><td><b>${esc(u.name || u.email)}</b>${u.id === au.id ? ' <span class="chip">você</span>' : ''}</td><td>${esc(u.email)}</td>
      <td><select data-role="${esc(u.id)}" aria-label="Perfil">${Object.entries(ROLES).map(([k, l]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
      <td class="muted">${u.addedAt ? new Date(u.addedAt).toLocaleDateString('pt-BR') : ''}</td>
      <td><button class="btn small" data-pw="${esc(u.id)}">Nova senha</button> <button class="btn small" data-rm="${esc(u.id)}" ${u.id === au.id ? 'disabled' : ''}>Remover</button></td></tr>`).join('');
    return `<div class="section-head"><div><div class="eyebrow">Administração</div><h2>Acessos</h2></div></div>
      <div class="notice ${pend ? 'warn' : ''}" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div>${gh ? (pend ? '<b>Alterações ainda não salvas no GitHub.</b> Clique em Salvar no GitHub.' : '<b>Cadastros salvos no GitHub.</b> Cada alteração é gravada direto no repositório e vale para todos em instantes. Não precisa baixar nem subir arquivo.') : (pend ? '<b>Alterações ainda não publicadas.</b> Os cadastros só valem para as outras pessoas depois de publicar. Não feche esta aba antes.' : 'Cadastros em dia. Cada pessoa entra com o e-mail e a senha que você cadastrar aqui.')}</div>
        <div class="filters">${gh ? `<button class="btn ${pend ? 'primary' : ''}" id="acSave">${pend ? 'Salvar no GitHub' : 'Salvar de novo'}</button><button class="btn" id="acTok">${au.hasToken() ? 'Trocar token do GitHub' : 'Informar token do GitHub'}</button>` : `${au.canPublish ? `<button class="btn ${pend ? 'primary' : ''}" id="acPub">Publicar alterações</button>` : ''}<button class="btn" id="acDl">Baixar página (index.html)</button>`}</div></div>
      <div class="grid-kpi" style="margin-top:14px"><div class="kcard" style="grid-column:1/-1"><header><h3>Pessoas com acesso</h3><span class="muted">${us.length} cadastrada${us.length === 1 ? '' : 's'}</span></header>
        <div class="tablebox"><table><thead><tr><th>Nome</th><th>E-mail (login)</th><th>Perfil</th><th>Cadastro</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="kcard" style="grid-column:1/-1"><header><h3>Cadastrar pessoa</h3></header>
        <div class="manin" style="flex-wrap:wrap"><input type="text" id="acName" placeholder="Nome" aria-label="Nome" style="min-width:180px" autocomplete="off"><input type="email" id="acEmail" placeholder="E-mail (será o login)" aria-label="E-mail" style="min-width:240px" autocomplete="off"><select id="acRole" aria-label="Perfil">${Object.entries(ROLES).map(([k, l]) => `<option value="${k}" ${k === 'consulta' ? 'selected' : ''}>${l}</option>`).join('')}</select><input type="text" id="acPw" value="${esc(gen())}" aria-label="Senha inicial" style="width:170px" autocomplete="off"><button class="btn small" id="acGen">Gerar senha</button><button class="btn primary small" id="acAdd">Cadastrar</button></div>
        <div class="muted" style="margin-top:8px">A senha tem pelo menos 10 caracteres. Anote e envie à pessoa antes de cadastrar: depois de salvo, ela não aparece mais.</div></div>
      <div class="kcard" style="grid-column:1/-1"><header><h3>Perfis</h3></header><ul class="plain">${Object.entries(ROLES).map(([k, l]) => `<li><b>${l}</b>: ${ROLE_HELP[k]}</li>`).join('')}</ul>
        <div class="muted" style="margin-top:8px">Remover alguém impede o login a partir da próxima abertura da página. Quem já tinha a página aberta ou salva continua com o que já viu. Para a gravação das bases no claude.ai, o compartilhamento do artefato também precisa permitir (Colaborador ou superior).</div></div></div>`;
  }
  function bindAcl(v) {
    const au = window.T1Auth;
    const act = async (fn, ok) => { try { await fn(); } catch (e) { toast(e && e.message || 'Não consegui concluir.'); render(); return; } if (au.mode === 'github') { render(); await saveGh(au); render(); } else { render(); if (ok) toast(ok); } };
    v.querySelector('#acGen').onclick = () => { v.querySelector('#acPw').value = gen(); };
    v.querySelector('#acAdd').onclick = () => act(async () => { await au.add({ name: v.querySelector('#acName').value, email: v.querySelector('#acEmail').value, role: v.querySelector('#acRole').value, password: v.querySelector('#acPw').value }); }, 'Pessoa cadastrada. Publique as alterações para valer.');
    v.querySelectorAll('[data-role]').forEach(s => s.onchange = () => act(async () => { try { await au.setRole(s.dataset.role, s.value); } catch (e) { render(); throw e; } }, 'Perfil atualizado. Publique para valer.'));
    v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => act(async () => au.remove(b.dataset.rm), 'Acesso removido. Publique para valer.'));
    v.querySelectorAll('[data-pw]').forEach(b => b.onclick = async () => { const u = au.users().find(x => x.id === b.dataset.pw); const pw = await askPassword('Nova senha', u ? u.email : ''); if (pw === null) return; act(async () => au.setPassword(b.dataset.pw, pw), 'Senha trocada. Publique para valer.'); });
    const sv = v.querySelector('#acSave'); if (sv) sv.onclick = async () => { sv.disabled = true; await saveGh(au); render(); };
    const tk = v.querySelector('#acTok'); if (tk) tk.onclick = async () => { const t = await askToken(); if (t) { au.setToken(t); toast('Token guardado neste navegador.'); render(); } };
    const pub = v.querySelector('#acPub'); if (pub) pub.onclick = async () => { pub.disabled = true; pub.textContent = 'Publicando…'; try { await au.publish(); toast('Publicado.'); } catch (e) { pub.disabled = false; pub.textContent = 'Publicar alterações'; toast(e && e.code === 'conflict' ? 'Existe uma versão mais nova; a página vai recarregar.' : (e && e.code === 'not_writer' ? 'Só Editores do artefato publicam. Use Baixar página.' : 'Não consegui publicar: ' + (e && (e.message || e.code) || 'erro'))); } };
    const dl = v.querySelector('#acDl'); if (dl) dl.onclick = async () => { try { await au.download(); } catch (e) { toast(e && e.code === 'cancelled' ? 'Download cancelado.' : 'Não consegui baixar: ' + (e && (e.message || e.code) || 'erro')); } };
  }

  /* ------------------------------------------------------------------ render geral */
  function render() {
    renderHeader();
    const v = $('#view');
    if (S.tab === 'acessos' && !aclTabVisible()) S.tab = 'ranking';
    v.innerHTML = S.tab === 'acessos' ? renderAcessos() : S.tab === 'ranking' ? renderRanking() : S.tab === 'resumo' ? renderResumo() : S.tab === 'bases' ? renderBases() : renderRegras();
    bind(v); if (S.tab === 'acessos') bindAcl(v);
  }
  function bind(v) {
    v.querySelectorAll('[data-rzlv]').forEach(b => b.onclick = () => { S.rzLevel = b.dataset.rzlv; S.rzEnt = null; render(); });
    const re = v.querySelector('#rzEnt'); if (re) re.onchange = () => { S.rzEnt = re.value; render(); };
    const fr = v.querySelector('#fReg'); if (fr) fr.onchange = () => { S.filterReg = fr.value; render(); };
    const fs = v.querySelector('#fSearch'); if (fs) fs.oninput = () => { S.search = fs.value; const p = fs.selectionStart; render(); const n = $('#fSearch'); n.focus(); n.setSelectionRange(p, p); };
    v.querySelectorAll('tbody tr[data-n]').forEach(tr => tr.onclick = () => openDetail(tr.dataset.k, tr.dataset.n));
    const ua = v.querySelector('#upAll'); if (ua) ua.onclick = () => { $('#fileAll').value = ''; $('#fileAll').click(); };
    v.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { S.upSlot = b.dataset.up; $('#fileOne').value = ''; $('#fileOne').click(); });
    const sb = v.querySelector('#saveBtn'); if (sb) sb.onclick = () => save(S.month);
    const oa = v.querySelector('#ovAdd'); if (oa) oa.onclick = () => {
      const [k, n] = v.querySelector('#ovEnt').value.split('|'); const kp = v.querySelector('#ovKpi').value; let val = v.querySelector('#ovVal').value.trim().replace(',', '.');
      if (!val) { toast('Informe o valor ou NA.'); return; } const x = val.toUpperCase() === 'NA' ? 'NA' : parseFloat(val); if (x !== 'NA' && !isN(x)) { toast('Valor inválido.'); return; }
      S.ver++; S.overrides[S.month] = Object.assign({}, S.overrides[S.month] || {}, { [`${kindOf[k]}|${n}|${kp}`]: { v: x, note: v.querySelector('#ovNote').value.trim() } }); render();
    };
    v.querySelectorAll('[data-delov]').forEach(b => b.onclick = () => { const o = Object.assign({}, S.overrides[S.month] || {}); delete o[b.dataset.delov]; S.ver++; S.overrides[S.month] = o; render(); });
    const qe = v.querySelector('#qEdit'); if (qe) qe.onclick = () => { S.editRegua = true; render(); };
    const qx = v.querySelector('#qCancel'); if (qx) qx.onclick = () => { S.editRegua = false; render(); };
    const qs = v.querySelector('#qSave'); if (qs) qs.onclick = () => {
      const q = JSON.parse(JSON.stringify(qFor(S.month))); let bad = false;
      v.querySelectorAll('.qinp').forEach(i => { const x = parseFloat(String(i.value).replace(',', '.')); if (!isN(x)) bad = true; else q[+i.dataset.k][+i.dataset.j] = x; });
      if (bad) { toast('Há limiares inválidos.'); return; }
      S.ver++; S.editRegua = false; S.qcfg = { byMonth: Object.assign({}, S.qcfg.byMonth, { [S.month]: q }) }; render(); toast('Limiares aplicados. Salve a apuração para gravar.');
    };
    const qc = v.querySelector('#qCopy'); if (qc) qc.onchange = () => { if (!qc.value) return; const src = S.qcfg.byMonth[qc.value] || SEED.q[qc.value]; S.ver++; S.qcfg = { byMonth: Object.assign({}, S.qcfg.byMonth, { [S.month]: JSON.parse(JSON.stringify(src)) }) }; render(); };
  }
  function wire() {
    $('#monthSel').onchange = async e => { S.month = e.target.value; await loadMonthInputs(S.month); render(); };
    $('#vMes').onclick = () => { S.view = 'mes'; render(); }; $('#vAno').onclick = () => { S.view = 'ano'; S.tab = 'ranking'; render(); };
    ['ranking', 'resumo', 'bases', 'regras', 'acessos'].forEach(t => $('#tab_' + t).onclick = () => { S.tab = t; render(); });
    $('#ghBtn').onclick = githubDialog;
    $('#outBtn').onclick = () => window.T1Auth && window.T1Auth.logout();
    $('#addMonth').onchange = e => { const v = e.target.value; if (/^\d{4}-\d{2}$/.test(v)) { if (!S.extraMonths.includes(v)) S.extraMonths.push(v); S.month = v; render(); } };
    $('#fileAll').onchange = e => { if (e.target.files.length) uploadDialog(Array.from(e.target.files)); };
    $('#fileOne').onchange = e => { if (e.target.files.length) uploadDialog(Array.from(e.target.files), S.upSlot); };
    $('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
  }

  /* ------------------------------------------------------------------ início */
  async function init() {
    wire();
    S.month = '2026-10';
    const gh = ST.githubConfig();
    applyAuth();
    try { const c = window.claude; if (window.T1Auth && c && c.use) window.T1Auth.canPublish = !!(await c.use('artifact').catch(() => null)); } catch (e) { }
    render();
    try {
      if (gh) { S.store = ST.githubStore(gh); S.storeKind = 'github'; await S.store.init(); S.canWrite = !!S.store.canWrite; S.canWriteBase = S.canWrite; applyAuth(); }
      else {
        const c = window.claude;
        const [db, user] = await Promise.all([c && c.use ? c.use('db').catch(() => null) : null, c && c.use ? c.use('user').catch(() => null) : null]);
        if (db) { S.store = ST.claudeStore(db, user); await S.store.init(); S.canWrite = S.store.canWrite !== false; S.canWriteBase = S.canWrite; applyAuth(); }
        else S.canWrite = false;
      }
      if (S.store) {
        S.ver++; S.results = await S.store.listResults().catch(() => ({}));
        S.overrides = await S.store.listOverrides().catch(() => ({}));
        const sc = await S.store.getScoring().catch(() => null); if (sc && sc.byMonth) S.qcfg = sc;
        const ms = Object.keys(S.results).sort(); if (ms.length && ms[ms.length - 1] > S.month) S.month = ms[ms.length - 1];
        await loadMonthInputs(S.month);
      }
    } catch (e) { $('#globalNotice').innerHTML = `<div class="notice warn">Não consegui abrir o armazenamento (${esc(e.message || e.code || e)}). Você pode consultar os dados incluídos, mas não salvar.</div>`; S.canWrite = false; }
    render();
  }
  init();
})();

</script>
<script data-keep id="auth-src">
/* Login do Termômetro de Segurança T1.
   Os dados (cadastro, quartis, bases e apuração) ficam criptografados (AES-256-GCM). Cada usuário tem a chave dos dados
   guardada sob a própria senha (PBKDF2-SHA256). Sem e-mail e senha válidos, nada é legível. Tudo roda no navegador. */
(function () {
  const te = new TextEncoder(), td = new TextDecoder(), SUB = crypto.subtle;
  const ART_HEAD = "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>";
  const $ = s => document.querySelector(s);
  const authRoot = $('#authRoot'), appRoot = $('#appRoot');
  let V = JSON.parse($('#vault').textContent);
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const hex = u8 => Array.from(u8).map(x => x.toString(16).padStart(2, '0')).join('');
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const ROLES = ['admin', 'apuracao', 'consulta'];

  async function kdf(pw, salt) {
    const base = await SUB.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return SUB.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: V.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function seal(key, bytes) {
    const iv = rnd(12), ct = new Uint8Array(await SUB.encrypt({ name: 'AES-GCM', iv }, key, bytes));
    const o = new Uint8Array(12 + ct.length); o.set(iv); o.set(ct, 12); return b64(o);
  }
  async function open(key, s) { const u = unb64(s); return new Uint8Array(await SUB.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, key, u.subarray(12))); }
  async function gz(bytes) {
    if (typeof CompressionStream === 'undefined') { const o = new Uint8Array(bytes.length + 1); o.set(bytes, 1); return o; }
    const z = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    const o = new Uint8Array(z.length + 1); o[0] = 1; o.set(z, 1); return o;
  }
  async function ungz(bytes) {
    const body = bytes.subarray(1); if (bytes[0] !== 1) return body;
    return new Uint8Array(await new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  const importK = raw => SUB.importKey('raw', raw, 'AES-GCM', true, ['encrypt', 'decrypt']);
  async function idOf(email) { return hex(new Uint8Array(await SUB.digest('SHA-256', te.encode(V.idsalt + '|' + email.trim().toLowerCase())))); }
  const sealJSON = async (K, o) => seal(K, await gz(te.encode(JSON.stringify(o))));
  const openJSON = async (K, s) => JSON.parse(td.decode(await ungz(await open(K, s))));

  /* ---------- cadastro remoto (GitHub Pages): vault.json no repositório ---------- */
  const HOST = (() => {
    let cfg = null; try { cfg = JSON.parse(localStorage.getItem('termo.github')); } catch (e) { }
    const m = location.hostname.match(/^([^.]+)\.github\.io$/i); if (!m) return null;
    const seg = location.pathname.split('/')[1] || '';
    const repo = (seg && !/\.html?$/i.test(seg)) ? seg : m[1] + '.github.io';
    return { owner: (cfg && cfg.owner) || m[1], repo: (cfg && cfg.repo) || repo, branch: (cfg && cfg.branch) || null };
  })();
  const getTok = () => { try { const t = localStorage.getItem('t1.ghtoken'); if (t) return t; const c = JSON.parse(localStorage.getItem('termo.github')); return (c && c.token) || ''; } catch (e) { return ''; } };
  const okVault = v => v && Array.isArray(v.users) && v.users.length && typeof v.data === 'string' && v.iter;
  async function loadRemoteVault() {
    if (!HOST) return;
    const api = `https://api.github.com/repos/${HOST.owner}/${HOST.repo}/contents/vault.json` + (HOST.branch ? '?ref=' + encodeURIComponent(HOST.branch) : '');
    try { const r = await fetch(api, { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' }); if (r.ok) { const v = await r.json(); if (okVault(v)) { V = v; return; } } } catch (e) { }
    let r; try { r = await fetch('vault.json?t=' + Date.now(), { cache: 'no-store' }); } catch (e) { throw new Error('Não consegui carregar o cadastro de acessos. Verifique a conexão e recarregue a página.'); }
    if (r.status === 404) return;
    if (!r.ok) throw new Error('Não consegui carregar o cadastro de acessos (HTTP ' + r.status + ').');
    const v = await r.json(); if (!okVault(v)) throw new Error('O arquivo vault.json do repositório está inválido.'); V = v;
  }
  const ghErr = async (r, what) => { const e = new Error(r.status === 401 ? 'Token do GitHub inválido ou expirado.' : (r.status === 403 || r.status === 404) ? 'O token não tem permissão para gravar neste repositório. Ele precisa de "Contents: Read and write" no repositório ' + HOST.owner + '/' + HOST.repo + '.' : (r.status === 409 || r.status === 422) ? 'Outra alteração foi salva ao mesmo tempo. Tente de novo.' : 'GitHub respondeu ' + r.status + ' ao ' + what + '.'); e.status = r.status; return e; };

  /* ---------- sessão (só nesta aba; sai ao fechar a aba ou clicar em Sair) ---------- */
  const sess = { get() { try { return JSON.parse(sessionStorage.getItem('t1s')); } catch (e) { return null; } }, set(o) { try { sessionStorage.setItem('t1s', JSON.stringify(o)); } catch (e) { } }, clear() { try { sessionStorage.removeItem('t1s'); } catch (e) { } } };

  /* ---------- tela de login ---------- */
  function showLogin(msg) {
    appRoot.hidden = true; authRoot.hidden = false;
    authRoot.innerHTML = `<div class="auth"><form class="authbox" id="authForm" autocomplete="on" novalidate>
      <div class="eyebrow">Segurança · Tier 1 · Demarco / Ambev</div><h1>Termômetro de Segurança T1</h1>
      <p class="muted">Entre com o e-mail e a senha cadastrados pelo administrador.</p>
      <label for="auEmail">E-mail</label><input type="email" id="auEmail" name="username" autocomplete="username" required>
      <label for="auPw">Senha</label><input type="password" id="auPw" name="password" autocomplete="current-password" required>
      <label class="small" style="font-weight:400"><input type="checkbox" id="auShow" style="width:auto;min-height:0"> Mostrar senha</label>
      <div class="auerr" id="auErr" role="alert">${msg || ''}</div>
      <button class="btn primary" id="auGo" type="submit">Entrar</button>
      <p class="muted small">Versão 2026-11-06 b3</p>
      <p class="muted small">Acesso restrito. Se você não tem cadastro ou esqueceu a senha, fale com o administrador do sistema.</p></form></div>`;
    $('#auEmail').focus(); $('#auShow').onchange = e => { $('#auPw').type = e.target.checked ? 'text' : 'password'; };
    $('#authForm').onsubmit = async e => {
      e.preventDefault(); const em = $('#auEmail').value.trim(), pw = $('#auPw').value, err = $('#auErr'), go = $('#auGo');
      if (!EMAIL_RE.test(em) || !pw) { err.textContent = 'Informe e-mail e senha.'; return; }
      go.disabled = true; go.textContent = 'Verificando…'; err.textContent = '';
      try { await login(em, pw); }
      catch (x) {
        if (x && x.invalid) { err.textContent = 'E-mail ou senha inválidos. Confira o e-mail e a senha (maiúsculas e minúsculas contam).'; $('#auPw').value = ''; $('#auPw').focus(); }
        else { console.error(x); err.textContent = 'Não consegui abrir o sistema depois de validar a senha. Detalhe técnico: ' + ((x && (x.message || x.name)) || x) + ' (versão 2026-11-06 b3)'; }
        go.disabled = false; go.textContent = 'Entrar';
      }
    };
  }
  const bad = () => { const e = new Error('credenciais'); e.invalid = true; return e; };
  async function login(email, pw) {
    const id = await idOf(email), rec = V.users.find(u => u.id === id);
    const tries = pw.trim() !== pw ? [pw, pw.trim()] : [pw];
    let raw = null;
    for (const p of tries) {
      const key = await kdf(p, rec ? unb64(rec.salt) : rnd(16));
      if (!rec) continue;
      try { raw = await open(key, rec.wk); break; } catch (e) { }
    }
    if (!rec || !raw) throw bad();
    await enter(raw, id, true);
  }

  /* ---------- entrada ---------- */
  async function enter(raw, id, save) {
    const K = await importK(raw), rec = V.users.find(u => u.id === id); if (!rec) throw new Error('usuário removido');
    const prof = await openJSON(K, rec.prof);
    const payload = await openJSON(K, V.data);
    window.T1_MASTER = payload.master; window.T1_SEED = payload.seed; window.T1_INPUTS = payload.inputs; window.T1_PERIODO = payload.periodo;
    window.T1Crypto = { active: true, enc: o => sealJSON(K, o), dec: s => openJSON(K, s) };
    const profs = {}; for (const u of V.users) { try { profs[u.id] = await openJSON(K, u.prof); } catch (e) { } }
    window.T1Auth = makeAuth(K, raw, id, prof, profs);
    if (save) sess.set({ k: b64(raw), id });
    authRoot.innerHTML = ''; authRoot.hidden = true;
    appRoot.innerHTML = $('#tpl-shell').innerHTML; appRoot.hidden = false;
    document.body.classList.remove('locked');
    for (const el of document.querySelectorAll('script[data-run]')) { const s = document.createElement('script'); s.textContent = el.textContent; document.body.appendChild(s); }
  }

  /* ---------- administração dos acessos ---------- */
  function makeAuth(K, raw, myId, myProf, profs) {
    const A = {
      id: myId, email: myProf.email, name: myProf.name || myProf.email, role: myProf.role, dirty: false, canPublish: false, publishNote: '', mode: HOST ? 'github' : 'local', host: HOST,
      hasToken() { return !!getTok(); },
      setToken(t) { try { localStorage.setItem('t1.ghtoken', (t || '').trim()); } catch (e) { } },
      async saveRemote() {
        if (!HOST) throw new Error('Gravação no GitHub só funciona na página publicada no GitHub Pages.');
        const tok = getTok(); if (!tok) { const e = new Error('Informe o token do GitHub.'); e.code = 'no_token'; throw e; }
        const url = `https://api.github.com/repos/${HOST.owner}/${HOST.repo}/contents/vault.json`, hd = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
        const q = HOST.branch ? '?ref=' + encodeURIComponent(HOST.branch) : '';
        let sha; const g = await fetch(url + q, { headers: hd, cache: 'no-store' });
        if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw await ghErr(g, 'ler o cadastro');
        const body = { message: 'Termômetro T1: atualização de acessos', content: b64(te.encode(JSON.stringify(V))) }; if (sha) body.sha = sha; if (HOST.branch) body.branch = HOST.branch;
        const p = await fetch(url, { method: 'PUT', headers: hd, body: JSON.stringify(body) });
        if (!p.ok) throw await ghErr(p, 'gravar o cadastro');
        A.dirty = false;
      },
      users() { return V.users.map(u => Object.assign({ id: u.id }, profs[u.id] || { email: '(ilegível)', name: '', role: 'consulta' })).sort((a, b) => String(a.addedAt || '') < String(b.addedAt || '') ? -1 : 1); },
      logout() { sess.clear(); location.reload(); },
      async add({ email, name, role, password }) {
        email = (email || '').trim().toLowerCase();
        if (!EMAIL_RE.test(email)) throw new Error('E-mail inválido.');
        if (!ROLES.includes(role)) throw new Error('Perfil inválido.');
        if (!password || password.length < 10) throw new Error('A senha precisa ter pelo menos 10 caracteres.');
        const id = await idOf(email); if (V.users.some(u => u.id === id)) throw new Error('Esse e-mail já está cadastrado. Use Nova senha para trocar a senha.');
        const salt = rnd(16), key = await kdf(password, salt), p = { email, name: (name || '').trim(), role, addedAt: new Date().toISOString(), addedBy: myProf.email };
        V.users.push({ id, salt: b64(salt), wk: await seal(key, raw), prof: await sealJSON(K, p) }); profs[id] = p; A.dirty = true;
      },
      async setPassword(id, password) {
        if (!password || password.length < 10) throw new Error('A senha precisa ter pelo menos 10 caracteres.');
        const u = V.users.find(x => x.id === id); if (!u) return; const salt = rnd(16); u.salt = b64(salt); u.wk = await seal(await kdf(password, salt), raw); A.dirty = true;
      },
      async setRole(id, role) {
        const u = V.users.find(x => x.id === id); if (!u || !ROLES.includes(role)) return;
        if (profs[id].role === 'admin' && role !== 'admin' && A.users().filter(x => x.role === 'admin').length < 2) throw new Error('Precisa existir pelo menos um administrador.');
        profs[id] = Object.assign({}, profs[id], { role }); u.prof = await sealJSON(K, profs[id]); A.dirty = true; if (id === myId) { A.role = role; }
      },
      remove(id) {
        if (id === myId) throw new Error('Você não pode remover o próprio acesso.');
        if (profs[id] && profs[id].role === 'admin' && A.users().filter(x => x.role === 'admin').length < 2) throw new Error('Precisa existir pelo menos um administrador.');
        V.users = V.users.filter(u => u.id !== id); delete profs[id]; A.dirty = true;
      },
      async html(kind) {
        const parts = Array.from(document.querySelectorAll('[data-keep]')).map(e => e.id === 'vault' ? '<script type="application/json" id="vault" data-keep>' + JSON.stringify(V) + '<\/script>' : e.outerHTML);
        const body = '<div id="authRoot"></div><div id="appRoot" hidden></div>\n' + parts.join('\n') + '\n';
        return kind === 'artifact' ? ART_HEAD + body + '</body></html>' : '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>' + body + '</body></html>';
      },
      async publish() {
        const c = window.claude; const art = c && c.use ? await c.use('artifact') : null; if (!art) throw new Error('Publicação indisponível neste ambiente.');
        sess.set({ k: b64(raw), id: myId }); await art.publish(await A.html('artifact')); A.dirty = false;
      },
      async download() {
        const html = await A.html('file'), blob = new Blob([html], { type: 'text/html' });
        const c = window.claude; const dl = c && c.use ? await c.use('downloads').catch(() => null) : null;
        if (dl) { await dl.save({ filename: 'index.html', data: blob }); return; }
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
      },
      genPassword() { const al = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = rnd(14); return Array.from(r).map(x => al[x % al.length]).join(''); },
    };
    return A;
  }

  /* ---------- início ---------- */
  (async function () {
    document.body.classList.add('locked');
    if (!SUB) { authRoot.innerHTML = '<div class="auth"><div class="authbox"><h1>Navegador sem suporte</h1><p>Este navegador não oferece a criptografia necessária. Abra a página em um navegador atualizado, por HTTPS.</p></div></div>'; return; }
    try { await loadRemoteVault(); } catch (e) { authRoot.innerHTML = '<div class="auth"><div class="authbox"><h1>Termômetro de Segurança T1</h1><p class="auerr">' + e.message + '</p></div></div>'; return; }
    const s = sess.get();
    if (s && s.k && s.id) { try { await enter(unb64(s.k), s.id, false); return; } catch (e) { sess.clear(); } }
    showLogin();
  })();
})();

</script>
</body></html>
